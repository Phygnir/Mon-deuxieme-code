<title>Cap Handstand</title>
<meta name="description" content="Programme de 26 semaines pour tenir 2 min en handstand et enchaîner 10 handstand push-ups.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: en-tête avec les deux objectifs, puis onglets ; la vue Semaine empile frise des 26 semaines → grille des 7 jours → détail de la séance. */
:root {
  --bg: #eef2f0;
  --surface: #ffffff;
  --sunk: #e3e9e6;
  --ink: #14201c;
  --muted: #5a6964;
  --line: #d2dbd7;
  --accent: #0b7a63;
  --accent-soft: #d5ece5;
  --on-accent: #ffffff;
  --p1: #3f74c9;
  --p2: #0b8f75;
  --p3: #c98a1c;
  --p4: #cf4a3c;
  --p5: #7a4fc4;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #16201d; --sunk: #1d2925; --ink: #e4ece9; --muted: #92a29c;
    --line: #2a3733; --accent: #3cc4a3; --accent-soft: #173a32; --on-accent: #06221b;
    --p1: #6d9be6; --p2: #3cc4a3; --p3: #e2a945; --p4: #ec7465; --p5: #a583e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #16201d; --sunk: #1d2925; --ink: #e4ece9; --muted: #92a29c;
  --line: #2a3733; --accent: #3cc4a3; --accent-soft: #173a32; --on-accent: #06221b;
  --p1: #6d9be6; --p2: #3cc4a3; --p3: #e2a945; --p4: #ec7465; --p5: #a583e6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(34px, 6vw, 52px); font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }
h2 { font-size: 26px; font-weight: 600; }
h3 { font-size: 21px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* En-tête */
header { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: end; justify-content: space-between; }
header .intro { display: grid; gap: 6px; min-width: 0; max-width: 60ch; }
.start { display: grid; gap: 4px; }
.start input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }

/* Sélecteur de programme */
.prog-switch { display: inline-flex; gap: 2px; padding: 3px; background: var(--sunk); border-radius: 10px; justify-self: start; margin-bottom: 6px; }
.prog-switch button { border: 0; background: transparent; padding: 6px 16px; border-radius: 8px; font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.prog-switch button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 18%, transparent); }
.log select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }

/* Objectifs */
.goals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; }
.goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.goal-big { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.goal-big small { font-size: 18px; color: var(--muted); font-weight: 500; }
.track { position: relative; height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.track > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.track-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Onglets */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 14px; font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* Frise des semaines */
.timeline { display: grid; gap: 8px; }
.weeks { display: grid; grid-template-columns: repeat(26, minmax(0, 1fr)); gap: 12px 3px; }
.wk { position: relative; border: 0; border-radius: 5px; height: 42px; padding: 0; background: color-mix(in srgb, var(--pc) 22%, var(--surface)); color: var(--ink); font-family: var(--font-display); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.wk.deload { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--pc) 22%, var(--surface)) 0 4px, var(--surface) 4px 8px); }
.wk.sel { background: var(--pc); color: var(--surface); }
.wk.now::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--pc); display: inline-block; }
.legend i.stripe { background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 4px); }

/* En-tête de semaine */
.week-head { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; align-items: end; }
.week-head .info { display: grid; gap: 4px; min-width: 0; max-width: 64ch; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; background: color-mix(in srgb, var(--pc) 18%, var(--surface)); color: var(--ink); border: 1px solid color-mix(in srgb, var(--pc) 45%, var(--surface)); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
.nav { display: flex; gap: 6px; }
.nav button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; }
.nav button:disabled { opacity: .4; cursor: default; }

/* Jours */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 10px 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.day.rest { background: transparent; border-style: dashed; }
.day.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day .d { display: flex; justify-content: space-between; align-items: center; }
.day .d b { font-family: var(--font-display); font-size: 18px; text-transform: uppercase; letter-spacing: .04em; }
.day .t { font-weight: 600; line-height: 1.25; }
.day .s { font-size: 13px; color: var(--muted); line-height: 1.35; }
.check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-grid; place-items: center; font-size: 12px; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tag-var { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 4px; justify-self: start; }
.defi { background: var(--accent-soft); border-radius: 8px; padding: 4px 14px 2px; }
.defi .ex-row .fig { background: var(--surface); }
.tag-test { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--p4); }

/* Détail séance */
.session { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 16px; }
.session-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: start; }
.session-head .info { display: grid; gap: 4px; min-width: 0; max-width: 64ch; }
.done-btn { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.done-btn.on { background: var(--accent); color: var(--on-accent); }
.blocks { display: grid; gap: 4px; }
.block-title { margin-top: 6px; }
.ex-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.ex-row:first-of-type { border-top: 0; }
.ex-row .fig { width: 150px; height: 125px; background: var(--sunk); border-radius: 8px; }
.ex-row .txt { display: grid; gap: 4px; min-width: 0; }
.ex-row .name { font-weight: 600; font-size: 16px; }
.ex-row .note { font-size: 14px; color: var(--muted); }
.ex-row .cues { margin: 2px 0 0; padding-left: 18px; font-size: 14px; }
.dose { text-align: right; display: grid; gap: 2px; justify-items: end; }
.dose b { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dose span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.log { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; padding: 14px; background: var(--accent-soft); border-radius: 8px; }
.log label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
.log input { width: 120px; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.rest-card { display: grid; gap: 8px; }

/* Bibliothèque */
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; }
.card .fig { width: 100%; aspect-ratio: 6 / 5; height: auto; max-width: 100%; background: var(--sunk); border-radius: 8px; }
.card ul { margin: 0; padding-left: 18px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); }

/* Progression */
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.phase { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--pc); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; align-content: start; }
.chart-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.chart-scroll { overflow-x: auto; }
.chart-scroll svg { display: block; min-width: 560px; width: 100%; height: auto; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.rules .card p { font-size: 14px; }

/* Figures */
.fig .pr { stroke: var(--muted); stroke-width: 2; fill: none; }
.fig .prf { fill: var(--line); stroke: var(--muted); stroke-width: 1.5; }
.fig .lb { stroke: var(--ink); stroke-linecap: round; stroke-width: 7; opacity: .35; }
.fig .lf { stroke: var(--ink); stroke-linecap: round; stroke-width: 7; }
.fig .tr { stroke: var(--ink); stroke-linecap: round; stroke-width: 10; }
.fig .hd { fill: var(--ink); }

@media (max-width: 860px) {
  .days { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .weeks { grid-template-columns: repeat(13, minmax(0, 1fr)); row-gap: 12px; }
}
@media (max-width: 560px) {
  .goals { grid-template-columns: 1fr; }
  .days { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ex-row { grid-template-columns: 110px minmax(0, 1fr); }
  .ex-row .fig { width: 110px; height: 92px; }
  .dose { grid-column: 2; justify-items: start; text-align: left; }
  .dose b { font-size: 24px; }
}
</style>

function phaseIndex(w) { return PHASES.findIndex(p => w >= p.from && w <= p.to); }
function rampT(w) {
  const p = PHASES[phaseIndex(w)];
  const last = DELOAD.has(p.to) ? p.to - 1 : p.to;
  if (last === p.from) return 0;
  return Math.min(1, (w - p.from) / (last - p.from));
}
const R = (a, b, t) => Math.round(a + (b - a) * t);
function fmtS(s) { if (s < 60) return s + " s"; const m = Math.floor(s / 60), r = s % 60; return m + " min" + (r ? " " + String(r).padStart(2, "0") : ""); }

function targetAt(w, key) {
  // interpolation linéaire entre les jalons de fin de phase
  const pts = [[0, START[key]]].concat(PHASES.map(p => [p.to, p[key]]));
  for (let i = 1; i < pts.length; i++) {
    const [w0, v0] = pts[i - 1], [w1, v1] = pts[i];
    if (w <= w1) return v0 + (v1 - v0) * (w - w0) / (w1 - w0);
  }
  return pts[pts.length - 1][1];
}

function item(ex, dose, unit, note) { return { ex, dose, unit, note }; }

function buildSession(w, type) {
  const s = PROG.base(w, type);
  if (s.test) return s;
  const pi = phaseIndex(w), si = SLOT_ORDER.indexOf(type);
  const v = (DELOAD.has(w) || w >= PROG.peakFrom) ? 0 : (w - 1 + si) % 3;
  const V = VARIANTS[type][v];
  const swap = it => {
    const to = V.swap && V.swap[it.ex];
    if (!to || (EX[to].minPhase || 0) > pi) return it;
    return Object.assign({}, it, { ex: to, note: EX[to].swapNote || it.note });
  };
  s.warm = s.warm.map(swap);
  s.main = s.main.map(swap);
  if (V.warmAdd) s.warm.push(V.warmAdd());
  if (V.ladder) {
    const i = s.main.findIndex(it => /^\d+ × \d+$/.test(it.dose) && +it.dose.split(" × ")[1] >= 3);
    if (i >= 0) {
      const [a, reps] = s.main[i].dose.split(" × ").map(Number);
      const b = Math.min(5, reps);
      const k = Math.max(1, Math.round(a * reps / (b * (b + 1) / 2)));
      s.main[i] = Object.assign({}, s.main[i], { dose: "1→" + b + (k > 1 ? " × " + k : ""), unit: "échelle", note: "1 rép., 20 s de repos, 2 rép.… jusqu'à " + b + ". " + (k > 1 ? "Repos 2 min, " : "") + (k > 1 ? "puis recommence (" + k + " échelles au total)" : "une seule échelle") });
    }
  }
  if (V.superset && s.main.length >= 3) {
    const n = s.main.length;
    s.main[n - 2] = Object.assign({}, s.main[n - 2], { unit: "superset A", note: "Enchaîne directement avec l'exercice suivant" });
    s.main[n - 1] = Object.assign({}, s.main[n - 1], { unit: "superset B", note: "Puis 90 s de repos et on repart sur A" });
  }
  if (V.circuit) {
    s.main = s.main.map(it => (it.dose.startsWith("EMOM") || it.unit === "cumulées") ? it : Object.assign({}, it, { dose: it.dose.split(" × ").pop(), unit: "circuit · " + (it.dose.includes(" × ") ? it.dose.split(" × ")[0] : 3) + " tours" }));
  }
  if (V.hsNote) s.main = s.main.map(it => it.ex === "hsFree" ? Object.assign({}, it, { note: V.hsNote }) : it);
  if (V.cluster && s.main.length) {
    const it = s.main[0], m = it.dose.match(/^(\d+) × (\d+) s$/);
    if (m) { const hs = Math.max(2, Math.round(+m[2] * 0.4)); s.main[0] = Object.assign({}, it, { dose: m[1] + " × (3 × " + hs + " s)", unit: "clusters", note: "3 tenues de " + hs + " s séparées de 10 s de repos = 1 série. Repos 2–3 min entre les séries" }); }
  }
  if (V.add) s.main.push(V.add(w));
  s.variant = V;
  const inSession = new Set(s.warm.concat(s.main).map(it => it.ex));
  const pool = DEFIS.filter(d => d.min <= pi && !inSession.has(d.ex));
  s.defi = pool.length ? pool[(w * 5 + si * 3) % pool.length] : null;
  return s;
}

      item(tp, "3", "essais", "Meilleure tenue propre dans la position de la phase, 3 min de repos entre les essais"),

      item("lsit", S(3) + " × " + R(10, 20, t) + " s", "repos 60 s", "")

      item("pppu", S(3) + " × " + R(10, 12, t), "repos 2 min", "Pieds surélevés si trop facile"),
      item("dips", S(3) + " × " + R(10, 15, t), "repos 90 s", ""),
      item("pullUp", S(3) + " × " + R(8, 12, t), "repos 2 min", "")

    main = [
      item(prev, R(40, 60, t) + " s", "cumulées", "Position plus facile, séries de 5 à 10 s"),
      item(tp, "EMOM " + (dl ? 5 : R(6, 10, t)) + " min", Math.max(2, Math.round(hold / 2)) + " s / min" + side, "Une tenue courte au début de chaque minute"),

      item("bearCrawl", "2 × 40 s", "", "Finisher")

  }
  return { warm, main, test: false };
}

const NS = "http://www.w3.org/2000/svg";
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let figures = [];
function el(tag, attrs, parent) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }

function makeFigure(id, cls) {
  const ex = EX[id];
  const svg = el("svg", { viewBox: "0 0 240 200", class: "fig " + (cls || ""), role: "img", "aria-label": "Animation : " + ex.name });
  const hasBars = ex.props.some(p => p.bars || p.pullbar);
  if (!hasBars) el("line", { x1: 8, y1: 190, x2: 232, y2: 190, class: "pr" }, svg);
  else el("line", { x1: 8, y1: 194, x2: 232, y2: 194, class: "pr", "stroke-dasharray": "4 5" }, svg);
  ex.props.forEach(p => {
    if (p.wall) el("line", { x1: p.wall, y1: 6, x2: p.wall, y2: 190, class: "pr" }, svg);
    if (p.box) el("rect", { x: p.box[0], y: p.box[1], width: p.box[2], height: p.box[3], rx: 2, class: "prf" }, svg);
    if (p.pad) el("rect", { x: p.pad[0], y: p.pad[1], width: p.pad[2], height: p.pad[3], rx: 2, class: "prf" }, svg);
    if (p.para) { const [x, y] = p.para; el("line", { x1: x - 13, y1: y + 2, x2: x - 17, y2: 190, class: "pr" }, svg); el("line", { x1: x + 13, y1: y + 2, x2: x + 17, y2: 190, class: "pr" }, svg); el("line", { x1: x - 17, y1: y + 2, x2: x + 17, y2: y + 2, class: "pr", "stroke-width": 5, "stroke-linecap": "round" }, svg); }
    if (p.pullbar) { el("line", { x1: 50, y1: p.pullbar, x2: 190, y2: p.pullbar, class: "pr", "stroke-width": 4, "stroke-linecap": "round" }, svg); }
    if (p.bars) { el("line", { x1: 70, y1: p.bars, x2: 180, y2: p.bars, class: "pr", "stroke-width": 4 }, svg); el("line", { x1: 80, y1: p.bars, x2: 80, y2: 194, class: "pr" }, svg); el("line", { x1: 170, y1: p.bars, x2: 170, y2: 194, class: "pr" }, svg); }
  });
  const L = (c) => el("line", { class: c }, svg);
  const parts = {
    a2u: L("lb"), a2l: L("lb"), l2u: L("lb"), l2l: L("lb"),
    tr: L("tr"), lu: L("lf"), ll: L("lf"), au: L("lf"), al: L("lf"),
    hd: el("circle", { r: 9, class: "hd" }, svg)
  };
  const fig = { svg, ex, parts, offset: Math.random() * 0.3 };
  // durée du cycle
  fig.total = ex.seq.reduce((a, s) => a + s[1] + s[2], 0);
  draw(fig, reduceMotion ? ex.poses[ex.poses.length > 2 ? 2 : 1] : ex.poses[0]);
  figures.push(fig);

}
function full(p) { return Object.assign({}, p, { e2: p.e2 || p.e, h2: p.h2 || p.h, k2: p.k2 || p.k, f2: p.f2 || p.f }); }
function setL(l, a, b) { l.setAttribute("x1", a[0]); l.setAttribute("y1", a[1]); l.setAttribute("x2", b[0]); l.setAttribute("y2", b[1]); }
function draw(fig, pose) {
  const P = full(pose), q = fig.parts;
  setL(q.a2u, P.s, P.e2); setL(q.a2l, P.e2, P.h2);
  setL(q.l2u, P.p, P.k2); setL(q.l2l, P.k2, P.f2);
  setL(q.tr, P.s, P.p); setL(q.lu, P.p, P.k); setL(q.ll, P.k, P.f);
  setL(q.au, P.s, P.e); setL(q.al, P.e, P.h);

const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
function lerpPose(a, b, t) {
  const A = full(a), B = full(b), o = {};
  for (const k in A) o[k] = [A[k][0] + (B[k][0] - A[k][0]) * t, A[k][1] + (B[k][1] - A[k][1]) * t];
  return o;
}
function tick(now) {
  const sec = now / 1000;
  figures.forEach(f => {
    if (!f.svg.isConnected) return;
    const seq = f.ex.seq;
    let t = (sec + f.offset * f.total) % f.total;
    for (let i = 0; i < seq.length; i++) {
      const [pi, hold, move] = seq[i];
      if (t < hold) { draw(f, f.ex.poses[pi]); return; }
      t -= hold;
      if (t < move) { const next = seq[(i + 1) % seq.length][0]; draw(f, lerpPose(f.ex.poses[pi], f.ex.poses[next], ease(t / move))); return; }
      t -= move;
    }
  });

}
if (!reduceMotion) requestAnimationFrame(tick);

  kids.flat().forEach(c => { if (c == null || c === false) return; n.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c); });

}

    const isDone = !!state.done[key];
    if (!type) {
      days.appendChild(h("button", { class: "day rest" + (state.day === d ? " sel" : ""), onclick: () => { state.day = d; render(); } },
        h("div", { class: "d" }, h("b", null, name.slice(0, 3)), h("span", { class: "muted", style: "font-size:12px" }, fmtDate(dateOf(w, d)))),
        h("div", { class: "t muted" }, d === 6 ? "Repos complet" : "Repos actif"),
        h("div", { class: "s" }, d === 6 ? "Rien. La force se construit pendant la récup." : PROG.restShort)));
      return;
    }
    const m = SESSION_META[type], sess = buildSession(w, type);
    const mains = sess.main.map(it => EX[it.ex].name);
    days.appendChild(h("button", { class: "day" + (state.day === d ? " sel" : ""), onclick: () => { state.day = d; render(); }, "aria-label": name + " : " + m.title },
      h("div", { class: "d" }, h("b", null, name.slice(0, 3)), h("span", { class: "check" + (isDone ? " on" : "") }, isDone ? "✓" : "")),
      h("span", { class: "muted", style: "font-size:12px" }, fmtDate(dateOf(w, d)) + " · ~" + m.min + " min"),
      sess.test ? h("span", { class: "tag-test" }, "Test") : sess.variant && sess.variant.name !== "Classique" ? h("span", { class: "tag-var" }, sess.variant.name) : null,
      h("div", { class: "t" }, m.title),
      h("div", { class: "s" }, mains.slice(0, 3).join(" · "))));
  });
  return h("div", { style: "display:grid;gap:22px" }, renderTimeline(), head, days, renderSession(w, state.day));
}

function exRow(it) {
  const ex = EX[it.ex];
  return h("div", { class: "ex-row" },
    makeFigure(it.ex),
    h("div", { class: "txt" },
      h("div", { class: "name" }, it.title || ex.name),
      it.note ? h("div", { class: "note" }, it.note) : h("div", { class: "note" }, ex.short),
      h("ul", { class: "cues" }, ex.cues.slice(0, 2).map(c => h("li", null, c)))),
    h("div", { class: "dose" }, h("b", null, it.dose), it.unit ? h("span", null, it.unit) : null));
}

function renderSession(w, d) {
  const type = SLOT[d];
  if (!type) {
    return h("section", { class: "session" },
      h("div", { class: "rest-card" },
        h("span", { class: "label" }, DAYS[d] + " · " + fmtDate(dateOf(w, d))),
        h("h3", null, d === 6 ? "Repos complet" : "Repos actif"),
        h("p", { class: "muted", style: "max-width:62ch" }, d === 6
          ? "Aucune séance. Dors bien, mange assez de protéines. Les épaules et les poignets récupèrent plus lentement que les muscles."
          : PROG.restLong),
        h("div", { class: "blocks" }, exRow(item("wrists", "3 min", "", "")))));
  }
  const m = SESSION_META[type], sess = buildSession(w, type), key = w + "-" + d, isDone = !!state.done[key];
  const box = h("section", { class: "session" },
    h("div", { class: "session-head" },
      h("div", { class: "info" },
        h("span", { class: "label" }, DAYS[d] + " · " + fmtDate(dateOf(w, d)) + " · ~" + m.min + " min"),
        h("h3", null, sess.test ? (w === NW ? "Test final" : "Test de fin de phase") : m.title),
        h("p", { class: "muted" }, sess.test ? "Bien échauffé, frais, sans fatigue de la veille. Note tes résultats en bas." : m.sub),
        sess.variant ? h("p", null, h("span", { class: "tag-var" }, "Version " + sess.variant.name), " ", h("span", { class: "muted", style: "font-size:14px" }, sess.variant.desc)) : null),
      h("button", { class: "done-btn" + (isDone ? " on" : ""), onclick: () => {
        if (state.done[key]) delete state.done[key]; else state.done[key] = true;
        store.set("done", state.done); render();
      } }, isDone ? "✓ Séance faite" : "Marquer comme faite")),
    h("div", { class: "blocks" }, h("span", { class: "label block-title" }, "Échauffement"), sess.warm.map(exRow)),
    h("div", { class: "blocks" }, h("span", { class: "label block-title" }, "Corps de séance"), sess.main.map(exRow)));
  if (sess.defi) {
    box.appendChild(h("div", { class: "blocks defi" },
      h("span", { class: "label block-title" }, "Défi bonus · facultatif, 5 min"),
      exRow({ ex: sess.defi.ex, dose: "Bonus", unit: "si tu as encore de l'énergie", note: sess.defi.d, title: sess.defi.t })));
  }

  if (sess.test) {
    const r = state.results[w] || {};
    const save = () => { const o = {}; PROG.logFields.forEach(f => { o[f.key] = $("#res-" + f.key).value; }); state.results[w] = o; store.set("results", state.results); renderGoals(); };
    box.appendChild(h("div", { class: "log" },
      PROG.logFields.map(f => h("label", { for: "res-" + f.key }, f.label,
        f.options
          ? h("select", { id: "res-" + f.key, onchange: save }, f.options.map((o, i) => h("option", { value: i, selected: String(r[f.key] ?? f.def) === String(i) }, o)))
          : h("input", { id: "res-" + f.key, type: "number", min: 0, inputmode: "numeric", value: r[f.key] || "", oninput: save }))),
      h("p", { class: "muted", style: "font-size:13px;max-width:44ch" }, PROG.logGoal(w) + " Tes résultats apparaissent dans l'onglet Progression.")));
  }
  return box;
}

function renderChart() {
  const C = PROG.chart, W = 640, H = 250, L = 64, Rt = 84, T = 16, B = 34;
  const x = w => L + w / NW * (W - L - Rt);
  const yL = v => T + (1 - v / C.left.max) * (H - T - B);
  const yR = v => T + (1 - v / C.right.max) * (H - T - B);
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Courbes d'objectifs sur " + NW + " semaines" });
  PHASES.forEach(p => el("rect", { x: x(p.from - 1), y: T, width: x(p.to) - x(p.from - 1), height: H - T - B, fill: "var(" + p.color + ")", opacity: .09 }, svg));
  C.left.ticks.forEach(v => {
    el("line", { x1: L, x2: W - Rt, y1: yL(v), y2: yL(v), stroke: "var(--line)" }, svg);
    const t = el("text", { x: L - 8, y: yL(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, svg); t.textContent = C.left.fmt(v);
  });
  C.right.ticks.forEach(v => { const t = el("text", { x: W - Rt + 8, y: yR(v) + 4, "font-size": 11, fill: "var(--muted)" }, svg); t.textContent = C.right.fmt(v); });
  C.xTicks.forEach(w => { const t = el("text", { x: x(w), y: H - B + 18, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" }, svg); t.textContent = "S" + w; });
  let dL = "", dR = "";
  for (let w = 0; w <= NW; w++) { dL += (w ? "L" : "M") + x(w) + " " + yL(PROG.target(w, C.left.key)); dR += (w ? "L" : "M") + x(w) + " " + yR(PROG.target(w, C.right.key)); }
  el("path", { d: dL, fill: "none", stroke: "var(--accent)", "stroke-width": 2.5 }, svg);
  el("path", { d: dR, fill: "none", stroke: "var(--p3)", "stroke-width": 2.5, "stroke-dasharray": "6 4" }, svg);
  Object.entries(state.results).forEach(([w, r]) => {
    if (r[C.left.key] !== "" && r[C.left.key] != null && +r[C.left.key] >= 0 && !(C.left.key === "hold" && !+r.hold)) el("circle", { cx: x(+w), cy: yL(Math.min(C.left.max * 1.05, +r[C.left.key])), r: 5, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
    if ((!C.right.needs || +r[C.right.needs]) && r[C.right.key] !== "" && r[C.right.key] != null && +r[C.right.key] >= 0 && !(C.right.key === "hspu" && !+r.hspu)) el("rect", { x: x(+w) - 5, y: yR(Math.min(C.right.max * 1.05, +r[C.right.key])) - 5, width: 10, height: 10, fill: "var(--p3)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
  });
  return svg;
}

function renderPlan() {
  const phases = h("div", { class: "phases" }, PHASES.map((p, i) => h("div", { class: "phase", style: pc(i) },
    h("span", { class: "label" }, "Semaines " + p.from + "–" + p.to),
    h("h3", null, p.name),
    h("p", { style: "font-weight:600" }, p.goal),
    h("p", { class: "muted", style: "font-size:14px" }, p.detail),
    h("p", { class: "num", style: "font-size:20px;margin-top:4px" }, PROG.phaseLine(p)))));
  const chart = h("div", { class: "chart-box" },
    h("div", { class: "goal-top" },
      h("h3", null, "Objectifs semaine par semaine"),
      h("div", { class: "legend" },
        h("span", { style: "--pc: var(--accent)" }, h("i"), PROG.chart.left.legend),
        h("span", { style: "--pc: var(--p3)" }, h("i"), PROG.chart.right.legend),
        h("span", null, "● ■ tes tests"))),
    h("div", { class: "chart-scroll" }, renderChart()));
  const rule = (t, p) => h("div", { class: "card" }, h("h3", null, t), h("p", { class: "muted" }, p));
  const rules = h("div", { class: "rules" }, PROG.rules.map(r => rule(r[0], r[1])));
  return h("div", { style: "display:grid;gap:22px" },
    h("div", { style: "display:grid;gap:6px;max-width:66ch" }, h("h2", null, PROG.planTitle),
      h("p", { class: "muted" }, PROG.planIntro)),
    phases, chart, rules);
}

function renderLib() {
  const used = {};
  for (let w = 1; w <= NW; w++) Object.values(SLOT).forEach(t => { const s = buildSession(w, t); s.warm.concat(s.main, s.defi ? [s.defi] : []).forEach(it => { (used[it.ex] = used[it.ex] || new Set()).add(phaseIndex(w)); }); });
  return h("div", { style: "display:grid;gap:18px" },
    h("div", { style: "display:grid;gap:6px;max-width:66ch" }, h("h2", null, "Les " + Object.keys(used).length + " exercices du programme"),
      h("p", { class: "muted" }, "Chaque animation montre le mouvement de profil. Le trait clair, c'est le bras ou la jambe du côté opposé.")),
    h("div", { class: "lib" }, Object.keys(EX).filter(id => used[id]).map(id => {
      const ex = EX[id];
      return h("article", { class: "card" },
        makeFigure(id),
        h("h3", null, ex.name),
        h("p", { class: "muted", style: "font-size:14px" }, ex.desc),
        h("ul", null, ex.cues.map(c => h("li", null, c))),
        h("div", { class: "chips" }, [...(used[id] || [])].sort().map(i => h("span", { class: "chip" }, PHASES[i].name))));
    })));
}

/* ---------- Démarrage ---------- */
function setProgram(id) {
  PROG = PROGRAMS[id] || PROGRAMS.hs;
  ({ phases: PHASES, start: START, tests: TEST_WEEKS, deload: DELOAD, slot: SLOT, meta: SESSION_META, variants: VARIANTS, order: SLOT_ORDER, defis: DEFIS, weeks: NW } = PROG);
  state.start = store.get("start", iso(mondayOf(new Date())));
  state.done = store.get("done", {});
  state.results = store.get("results", {});
  $("#start-date").value = state.start;
  try { localStorage.setItem("cap:prog", PROG.id); } catch (e) {}
  initPosition();
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { state.tab = b.dataset.tab; render(); }));
document.querySelectorAll(".prog-switch button").forEach(b => b.addEventListener("click", () => { if (b.dataset.prog !== PROG.id) { setProgram(b.dataset.prog); render(); } }));
const sd = $("#start-date");
sd.addEventListener("change", () => {
  if (!sd.value) return;
  state.start = iso(mondayOf(new Date(sd.value + "T12:00:00")));
  sd.value = state.start;
  store.set("start", state.start);
  initPosition(); render();
});
let savedProg = "hs";
try { savedProg = localStorage.getItem("cap:prog") || "hs"; } catch (e) {}
setProgram(savedProg);
render();
</script>
