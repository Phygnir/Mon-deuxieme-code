<style>
/* Layout : l'échiquier à gauche comme sur une table de club, le carnet du coach à droite ; une seule colonne sur téléphone. */
:root {
  --bg: #e7ebe4;
  --surface: #f6f8f3;
  --ink: #16201a;
  --muted: #56655b;
  --line: #cdd6cb;
  --accent: #1d6b45;
  --accent-ink: #ffffff;
  --accent-soft: #d6e8dc;
  --good: #1f7a4a;
  --good-bg: #dcefe2;
  --warn: #8a5a00;
  --warn-bg: #f6e8c6;
  --bad: #a3271f;
  --bad-bg: #f7dcd8;
  --sq-light: #ebe6d0;
  --sq-dark: #6e8f5d;
  --sq-light-hl: #f3e58a;
  --sq-dark-hl: #b7b84a;
  --frame: #2f3d33;
  --star: #e0a100;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #19201b; --ink: #e4ebe5; --muted: #95a59a; --line: #2c3730;
    --accent: #4fb380; --accent-ink: #0d1510; --accent-soft: #1f3a2b;
    --good: #6fd29a; --good-bg: #173324; --warn: #e8b850; --warn-bg: #352a12; --bad: #f08a80; --bad-bg: #3a1a17;
    --sq-light: #d9d4bd; --sq-dark: #5d7b4e; --sq-light-hl: #e6d877; --sq-dark-hl: #a3a43e; --frame: #0a0e0b; --star: #f2b51c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19201b; --ink: #e4ebe5; --muted: #95a59a; --line: #2c3730;
  --accent: #4fb380; --accent-ink: #0d1510; --accent-soft: #1f3a2b;
  --good: #6fd29a; --good-bg: #173324; --warn: #e8b850; --warn-bg: #352a12; --bad: #f08a80; --bad-bg: #3a1a17;
  --sq-light: #d9d4bd; --sq-dark: #5d7b4e; --sq-light-hl: #e6d877; --sq-dark-hl: #a3a43e; --frame: #0a0e0b; --star: #f2b51c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1140px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; }

/* En-tête */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 44px; height: 44px; border-radius: 10px; background: var(--sq-dark); display: grid; place-items: center; box-shadow: inset 0 0 0 3px var(--frame); }
.brand-mark .pc { width: 78%; height: 78%; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; letter-spacing: -0.02em; margin: 0; line-height: 1.05; }
.brand p { margin: 0; font-size: 0.82rem; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 0.92rem; color: var(--muted); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* Grille principale */
.main { display: grid; grid-template-columns: minmax(0, 580px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 880px) { .main { grid-template-columns: minmax(0, 1fr); } }
.board-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* Échiquier */
.board-wrap { position: relative; width: 100%; max-width: 580px; aspect-ratio: 1; container-type: inline-size; border: 7px solid var(--frame); border-radius: 8px; background: var(--frame); box-shadow: 0 10px 30px -14px rgba(0,0,0,.45); touch-action: none; user-select: none; -webkit-user-select: none; }
.board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; border-radius: 2px; overflow: hidden; }
.sq { position: relative; display: grid; place-items: center; cursor: pointer; }
.sq.l { background: var(--sq-light); }
.sq.d { background: var(--sq-dark); }
.sq.l.hl { background: var(--sq-light-hl); }
.sq.d.hl { background: var(--sq-dark-hl); }
.sq.sel { box-shadow: inset 0 0 0 4px rgba(29,107,69,.85); }
.sq.check { background: radial-gradient(circle, #ff5a48 0%, #e0352a 35%, rgba(224,53,42,0) 75%), var(--sq-light); }
.sq.d.check { background: radial-gradient(circle, #ff5a48 0%, #e0352a 35%, rgba(224,53,42,0) 75%), var(--sq-dark); }
.sq.flash-ok::after, .sq.flash-bad::after { content: ""; position: absolute; inset: 0; animation: flash .45s ease-out forwards; }
.sq.flash-ok::after { background: rgba(40,170,90,.7); }
.sq.flash-bad::after { background: rgba(220,50,40,.7); }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
/* Pièces : jeu « cburnett » de Colin M. L. Burnett (GPLv2+), celui de Lichess et Wikipédia */

.pc.mini { display: inline-block; width: 1.35em; height: 1.35em; filter: none; vertical-align: middle; }

.pc.ghosted { opacity: 0.25; }
.dot { position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(18,40,24,.28); z-index: 2; pointer-events: none; }
.ring { position: absolute; inset: 5%; border-radius: 50%; border: 0.75cqi solid rgba(18,40,24,.32); z-index: 2; pointer-events: none; }
.star { position: absolute; font-size: 7cqi; color: var(--star); text-shadow: 0 1px 0 rgba(0,0,0,.35); pointer-events: none; animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: scale(1.12) rotate(8deg); } }
.co { position: absolute; font-family: var(--font-mono); font-weight: 700; font-size: 2.1cqi; line-height: 1; pointer-events: none; }
.co.f { right: 6%; bottom: 5%; }
.co.r { left: 6%; top: 6%; }
.sq.l .co { color: var(--sq-dark); }
.sq.d .co { color: var(--sq-light); }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.drag-ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -50%); }
.drag-ghost .pc { width: 100%; height: 100%; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
.promo { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(10,14,11,.55); }
.promo-box { display: flex; gap: 8px; background: var(--surface); border-radius: 12px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.promo-box button { width: 16cqi; height: 16cqi; border-radius: 10px; border: 1px solid var(--line); background: var(--sq-light); cursor: pointer; display: grid; place-items: center; }
.promo-box button:hover { background: var(--sq-light-hl); }
.promo-box .pc { width: 85%; height: 85%; }

/* Sous l'échiquier */
.under { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 28px; font-size: 0.9rem; color: var(--muted); }
.captured { display: inline-flex; align-items: center; font-size: 1.05rem; }
.captured .pc.mini { margin-right: -0.5em; }
.captured b { font-family: var(--font-mono); font-size: 0.8rem; margin-left: 0.8em; color: var(--muted); }

/* Panneau */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.11em; font-weight: 700; color: var(--accent); margin: 0; }
.panel h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; letter-spacing: -0.02em; line-height: 1.1; margin: 0; text-wrap: balance; }
.panel h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; margin: 0; }
.lead { margin: 0; color: var(--muted); max-width: 62ch; }
.text { margin: 0; font-size: 1.04rem; max-width: 62ch; }
.text strong { color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--bg); padding: 9px 15px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.92rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; }
.fb { border-radius: 10px; padding: 11px 14px; font-weight: 700; font-size: 0.97rem; }
.fb.ok { background: var(--good-bg); color: var(--good); }
.fb.bad { background: var(--bad-bg); color: var(--bad); }
.fb.warn { background: var(--warn-bg); color: var(--warn); }
.fb.info { background: var(--accent-soft); color: var(--ink); font-weight: 400; }
.fb small { display: block; font-weight: 400; color: var(--ink); margin-top: 3px; }
.progress { display: flex; gap: 5px; }
.progress span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.progress span.on { background: var(--accent); }

/* Listes leçons / exercices */
.list { display: flex; flex-direction: column; gap: 6px; }
.item { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 11px; padding: 9px 10px; cursor: pointer; }
.item:hover { background: var(--bg); border-color: var(--line); }
.item .num { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 0.85rem; background: var(--bg); border: 1px solid var(--line); }
.item.done .num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.item .glyph { display: grid; place-items: center; }
.item .glyph .pc.mini { width: 1.9rem; height: 1.9rem; }
.item .ti { font-weight: 700; display: block; }
.item .de { font-size: 0.85rem; color: var(--muted); display: block; }
.pill { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.done { background: var(--good-bg); color: var(--good); border-color: transparent; }
.group-title { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.11em; font-weight: 700; color: var(--muted); margin: 8px 0 2px 10px; }

/* Parcours */
.paths { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.path { display: flex; flex-direction: column; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 14px; cursor: pointer; }
.path:hover { border-color: var(--accent); }
.path.done { border-color: var(--accent); }
.path.wide { grid-column: 1 / -1; }
@media (max-width: 880px) { body.lists .board-col { display: none; } }
.path-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.path-name { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -0.01em; }
.path-desc { font-size: 0.88rem; color: var(--muted); min-height: 2.6em; }
.path-foot { display: flex; align-items: center; gap: 10px; }
.path-count { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { flex: 1; height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.lvl { display: inline-flex; gap: 3px; }
.lvl i { width: 7px; height: 14px; border-radius: 2px; background: var(--line); }
.lvl i.on { background: var(--accent); }
.line-moves { font-family: var(--font-mono); font-size: 0.92rem; line-height: 1.8; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.line-moves .n { color: var(--muted); }
.line-moves .cur { color: var(--accent); font-weight: 700; }

/* Partie */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-weight: 700; font-size: 0.88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; color: var(--muted); }
.settings { display: flex; flex-wrap: wrap; gap: 14px 22px; }
.moves { font-family: var(--font-mono); font-size: 0.9rem; max-height: 220px; overflow-y: auto; display: grid; grid-template-columns: 2.6em minmax(0, 6.5em) minmax(0, 6.5em); gap: 2px 8px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.moves .n { color: var(--muted); }
.moves .cur { color: var(--accent); font-weight: 700; }
.moves:empty::before { content: "Les coups s'afficheront ici, en notation française (C = cavalier, F = fou, T = tour, D = dame, R = roi)."; grid-column: 1 / -1; color: var(--muted); font-family: var(--font-body); font-size: 0.86rem; }
.balance { display: flex; flex-direction: column; gap: 5px; }
.balance-bar { height: 10px; border-radius: 6px; background: #1f2420; overflow: hidden; border: 1px solid var(--line); }
.balance-bar i { display: block; height: 100%; background: #f4f1e4; transition: width .4s ease; }
.balance small { color: var(--muted); font-size: 0.84rem; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 700; font-size: 0.92rem; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }
.stats { display: flex; gap: 18px; font-size: 0.86rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-family: var(--font-mono); }

/* Coordonnées */
.target { font-family: var(--font-mono); font-weight: 700; font-size: 4.2rem; line-height: 1; letter-spacing: -0.02em; color: var(--accent); }
.scorebox { display: flex; gap: 26px; font-variant-numeric: tabular-nums; }
.scorebox div { display: flex; flex-direction: column; }
.scorebox b { font-family: var(--font-mono); font-size: 1.6rem; }
.scorebox span { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
.target-mini { font-family: var(--font-mono); font-weight: 700; font-size: 1.5rem; line-height: 1; color: var(--accent); }
.timer { height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--accent); }

.foot { margin-top: 28px; font-size: 0.82rem; color: var(--muted); }
.kbd { font-family: var(--font-mono); font-size: 0.85em; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }

@media (prefers-reduced-motion: reduce) {
  .star { animation: none; }
  .sq.flash-ok::after, .sq.flash-bad::after { animation-duration: .01s; }
  .balance-bar i { transition: none; }
}
@media (max-width: 480px) {
  .panel { padding: 16px; }
  .panel h2 { font-size: 1.45rem; }
  .tab { padding: 7px 10px; font-size: 0.86rem; }
  .board-wrap { border-width: 4px; }
}

    L.moves++;
    B.stars.delete(m.to);
    render();
    if (!B.stars.size) {
      L.done = true; B.locked = true;
      const rating = L.moves <= st.par ? 3 : L.moves === st.par + 1 ? 2 : 1;
      setFb(rating === 3 ? "ok" : "warn", `${"★".repeat(rating)}${"☆".repeat(3 - rating)} &nbsp;${rating === 3 ? "Parcours parfait !" : `Réussi en ${L.moves} coups. Possible en ${st.par} : réessaie si tu veux.`}`);
    } else lessonPanel();
    return;
  }
  if (st.k === "move") {
    const status = g.status();
    let ok = false;
    if (st.accept && st.accept.length) ok = st.accept.some(a => u === a || (a.length === 4 && u.startsWith(a)));
    if (st.goal === "check") ok = g.inCheck();
    if (st.goal === "mate") ok = status === "mate";
    if (ok) return stepDone(st.ok || "Bravo !");
    let msg = st.no || "Ce n'est pas le coup attendu. Relis la consigne et réessaie.";
    if (status === "stalemate") msg = "Pat ! Le roi noir n'est pas en échec mais ne peut plus bouger : c'est nul. Essaie un autre coup.";
    return rejectMove(msg);
  }
  if (st.k === "line") {
    const exp = st.moves[L.ply];
    if (u === exp || (exp.length === 4 && u.startsWith(exp))) {
      L.sans.push(san);
      L.note = st.notes && st.notes[L.ply] ? st.notes[L.ply] : null;
      L.ply++;
      setFb(null);
      lineAdvance();
    } else {
      const want = (() => { g.undo(); const mm = g.find(exp); const s = mm ? frSan(g.san(mm)) : exp; g.make(m); return s; })();
      rejectMove(st.guide ? `Suis la flèche : ici on joue ${want}.` : L.errors >= 1 ? `Dans cette ligne, on joue ${want}. La flèche te le montre.` : "Ce n'est pas le coup de la ligne. Réessaie.", 1000);
      if (!st.guide && L.errors >= 2) later(() => { const mm = g.find(exp); if (mm) { B.arrows = [[mm.from, mm.to]]; render(); } }, 1050);
    }
    return;
  }
  if (st.k === "mate") {
    if (g.status() === "mate") { L.userMoves++; return stepDone(L.errors ? "Mat ! Bien joué." : "Mat, trouvé du premier coup !"); }
    if (!forcedMate(g, st.n - L.userMoves - 1)) return rejectMove("Ce coup laisse le roi s'échapper. Cherche les échecs et les sacrifices.");
    L.userMoves++;
    B.locked = true;
    setFb("ok", "Bon coup ! Le roi noir se défend...");
    later(() => {
      const r = think(g, { depth: 3, time: 700 });
      commit(r.move, true);
      B.locked = false;
      setFb("info", "À toi, termine le travail.");
    }, 550);
    return;
  }
  if (st.k === "kpk") {
    if (m.promo) {
      if (m.promo === "Q" || m.promo === "R") return stepDone("Le pion devient dame : la finale est gagnée !");
      return rejectMove("Un fou ou un cavalier seul ne peut pas mater. Promeus en dame.");
    }
    if (!KPK.win(g)) {
      const st2 = g.status();
      return rejectMove(st2 === "stalemate" ? "Pat ! Le roi noir n'a plus de coup : partie nulle. Laisse-lui une case." : "Ce coup laisse filer le gain : la position devient nulle. Pense à l'opposition et garde ton roi devant le pion.", 1300);
    }
    B.locked = true;
    setFb(null);
    later(() => {
      // Le roi noir cherche la meilleure défense : rester près du pion et de sa case de promotion
      const p = g.b.indexOf("P"), qsq = p & 7;
      let best = null, bestS = -Infinity;
      for (const r of g.moves()) {
        const d = Math.max(Math.abs((r.to >> 3) - (p >> 3)), Math.abs((r.to & 7) - (p & 7))) + Math.max(r.to >> 3, Math.abs((r.to & 7) - qsq));
        const s = -d + Math.random() * 0.5;
        if (s > bestS) { bestS = s; best = r; }
      }
      commit(best, true);
      B.locked = false;
      L.errors = 0;
    }, 420);
  }
}
function lessonSquare(sq) {
  const st = L.lesson.steps[L.i];
  if (L.done) return;
  if (sqName(sq) === L.targets[0]) {
    flashSq(sq, "flash-ok");
    L.targets.shift(); L.found++;
    if (!L.targets.length) { L.done = true; B.coords = true; render(); setFb("ok", "Tu sais lire l'échiquier. Pour t'entraîner encore, va dans l'onglet Coordonnées."); }
    else setFb(null);
  } else {
    flashSq(sq, "flash-bad");
    setFb("bad", `Ça, c'est ${sqName(sq)}. Cherche ${st.targets[L.found]}.`);
  }
}
function lessonPick(sq) {
  const st = L.lesson.steps[L.i], name = sqName(sq);
  if (L.done) return;
  if (st.answers.includes(name)) {
    flashSq(sq, "flash-ok");
    L.found.add(name); B.marks.add(sq);
    if (!st.all || L.found.size === st.answers.length) { L.done = true; render(); setFb("ok", st.ok || "Exact !"); }
    else setFb("ok", "Oui ! Il en reste.");
  } else {
    flashSq(sq, "flash-bad");
    setFb("bad", st.no || "Non, regarde mieux.");
  }
}

function puzzleBestMove() {
  const p = P.cur, g = B.game;
  if (p.goal === "mate") return mateIn(g, p.n - P.userMoves);
  if (p.goal === "gain") return g.find(p.line[P.i]);
  const r = think(g, { depth: 4, time: 700 });
  return r && r.move;
}
function puzzleHint() {
  if (B.locked) return;
  const m = puzzleBestMove();
  if (!m) return;
  P.hint++;
  if (P.hint === 1) { B.marks = new Set([m.from]); P.fb = { c: "info", t: `Indice : la pièce à jouer est ${POSS[m.piece.toLowerCase()]} ${NAME[m.piece.toLowerCase()]} en ${sqName(m.from)}.` }; }
  else { B.marks = new Set(); B.arrows = [[m.from, m.to]]; P.fb = { c: "info", t: "Voici le coup. Joue-le pour continuer." }; }
  render(); puzzlePanel();
}
function puzzleSolved() {
  P.solved = true; B.locked = true;
  save.puzzles[P.cur.id] = true; persist();
  const clean = !P.errors && !P.hint;
  P.fb = { c: "ok", t: clean ? "Résolu du premier coup, bravo !" : "Résolu ! Tu retiendras le motif." };
  puzzlePanel();
}
function puzzleMove(m) {
  const p = P.cur, g = B.game, u = uci(m);
  if (p.goal === "convert") return convertMove();
  let ok;
  if (p.goal === "mate") ok = g.status() === "mate" || forcedMate(g, p.n - P.userMoves - 1);
  else ok = u === p.line[P.i] || (p.line[P.i].length === 4 && u.startsWith(p.line[P.i]));
  if (!ok) {
    P.errors++; B.locked = true;
    P.fb = { c: "bad", t: "Pas tout à fait. Cherche les échecs, les captures et les menaces, puis réessaie." };
    puzzlePanel();
    later(() => { g.undo(); B.last = null; B.locked = false; render(); }, 900);
    return;
  }
  P.userMoves++; P.i++;
  if (g.status() === "mate" || (p.goal === "gain" && P.i >= p.line.length)) return puzzleSolved();
  B.locked = true;
  P.fb = { c: "ok", t: "Bon coup ! Attends la réponse..." };
  puzzlePanel();
  later(() => {
    let r = p.goal === "gain" ? g.find(p.line[P.i]) : null;
    if (!r) { const t = think(g, { depth: 3, time: 600 }); r = t && t.move; }
    P.i++;
    commit(r, true);
    B.locked = false;
    P.fb = { c: "info", t: "À toi. Termine le travail." };
    puzzlePanel();
  }, 550);
}
function convertMove() {
  const g = B.game;
  P.userMoves++;
  const st = g.status();
  if (st === "mate") { P.fb = null; puzzleSolved(); P.fb = { c: "ok", t: `Mat en ${P.userMoves} coups. Technique maîtrisée !` }; puzzlePanel(); return; }
  if (st) {
    B.locked = true;
    P.fb = { c: "bad", t: st === "stalemate" ? "Pat ! Le roi noir n'a plus de coup mais n'est pas en échec : nulle. Laisse-lui toujours une case." : "La pièce a été perdue, c'est nul. Recommence." };
    puzzlePanel(); return;
  }
  B.locked = true; P.fb = null; puzzlePanel();
  later(() => {
    const t = think(g, { depth: 3, time: 500 });
    commit(t.move, true);
    const s2 = g.status();
    if (s2) { P.fb = { c: "bad", t: "Le roi noir a pris ta pièce : nulle. Garde ta pièce protégée et recommence." }; B.locked = true; puzzlePanel(); return; }
    B.locked = false;
  }, 380);
}

function balanceText() {

  if (Math.abs(v) < 40) return "Position équilibrée.";

}
function playHint() {
  if (thinking || PL.over) return;
  const r = think(B.game, { depth: 4, time: 900 });
  if (!r) return;
  B.arrows = [[r.best.from, r.best.to]];
  PL.coachMsg = { c: "info", t: `Indice : ${frSan(B.game.san(r.best))}`, s: "La flèche montre le coup conseillé." };
  render(); playPanel();
}
function playUndo() {
  if (thinking || !PL.log.length) return;
  PL.log.pop();
  while (PL.log.length && (PL.log.length % 2 === 0 ? "w" : "b") !== PL.color) PL.log.pop();
  PL.over = null; PL.coachMsg = null;
  savePlay();
  rebuildGame(); B.locked = false; B.sel = null; B.arrows = [];
  render(); playPanel();

function endGame(res, text) {
  PL.over = { r: res, c: res === "w" ? "ok" : res === "d" ? "warn" : "bad", t: text };
  save.record[res]++;
  B.locked = true;
  savePlay(); playPanel();
}
function checkOver() {
  const g = B.game, st = g.status();
  if (!st) return false;
  if (st === "mate") {
    const userWon = g.turn !== PL.color;
    endGame(userWon ? "w" : "l", userWon ? "Échec et mat ! Tu as gagné." : "Échec et mat. L'ordinateur gagne cette fois-ci.");
  } else {
    const why = { stalemate: "Pat", fifty: "Règle des 50 coups", insufficient: "Matériel insuffisant pour mater", repetition: "Triple répétition" }[st];
    endGame("d", `Partie nulle : ${why}.`);
  }
  return true;
}
function coachReview(m, san) {
  const g = B.game, me = PL.color, sign = me === "w" ? 1 : -1;
  g.undo();
  const before = think(g, { depth: 2, time: 500 });
  g.make(m);
  let after;
  const replies = g.moves();
  if (!replies.length) after = g.inCheck() ? MATE : 0;
  else { const r = think(g, { depth: 1, time: 300 }); after = -r.score; }
  PL.bal = sign * after;
  const best = before.best, bestSan = frSan((() => { g.undo(); const s = g.san(best); g.make(m); return s; })());
  const loss = before.bestScore - after;
  const isBest = uci(best) === uci(m);
  if (before.bestScore > MATE - 1000 && after < MATE - 1000) return { c: "warn", t: "Tu avais un mat !", s: `${bestSan} matait directement.` };
  if (isBest || loss < 40) return { c: "ok", t: isBest ? `${frSan(san)} : excellent coup.` : `${frSan(san)} : bon coup.` };
  // Pièces laissées en prise
  let hang = null;
  for (const r of replies) {
    if (!r.captured || colorOf(r.captured) !== me) continue;
    const tv = VAL[r.captured.toLowerCase()], av = VAL[r.piece.toLowerCase()];
    if ((!g.attacked(r.to, me) || av < tv) && (!hang || tv > hang.v)) hang = { v: tv, t: r.captured.toLowerCase(), sq: r.to };
  }
  const why = hang ? `Attention : ${POSS[hang.t]} ${NAME[hang.t]} en ${sqName(hang.sq)} peut être pris${hang.t === "q" || hang.t === "r" ? "e" : ""}. ` : "";
  if (loss >= 250) return { c: "bad", t: `${frSan(san)} : gaffe.`, s: `${why}Il fallait jouer ${bestSan}.` };
  if (loss >= 90) return { c: "warn", t: `${frSan(san)} : imprécision.`, s: `${why}Meilleur : ${bestSan}.` };
  return { c: "ok", t: `${frSan(san)} : coup correct.`, s: `${bestSan} était un peu plus précis.` };
}
function playMove(m, san) {
  PL.log.push({ u: uci(m), san });
  PL.coachMsg = null;
  if (PL.coach) { try { PL.coachMsg = coachReview(m, san); } catch (e) { PL.coachMsg = null; } }
  savePlay();
  if (checkOver()) return;
  aiMove();
}
function aiMove() {
  thinking = true; B.locked = true; playPanel();
  later(() => {
    const g = B.game;
    const r = think(g, LEVELS[PL.level].cfg);
    thinking = false;
    if (!r) { checkOver(); return; }
    const san = g.san(r.move);
    PL.log.push({ u: uci(r.move), san });
    g.make(r.move);
    B.last = [r.move.from, r.move.to]; B.sel = null;
    B.locked = false;
    savePlay();
    render();
    if (!checkOver()) playPanel();
  }, 350);
}

function newTarget() { let t; do { t = (Math.random() * 64) | 0; } while (sqName(t) === C.target); C.target = sqName(t); }
function coordPanel(done) {
  $("#under-top").innerHTML = C.running ? `<span>Clique sur</span><span class="target-mini" id="ctarget-mini">${C.target}</span>` : "";
  panel.innerHTML = `
    <p class="eyebrow">Entraînement · 30 secondes</p>
    <h2>Lis l'échiquier sans réfléchir</h2>
    <p class="lead">Une case s'affiche, clique-la le plus vite possible. Connaître les coordonnées par cœur aide à lire les livres, les vidéos et à noter tes parties.</p>
    ${C.running ? `<div class="target" id="ctarget">${C.target}</div><div class="timer"><i id="ctimer" style="width:100%"></i></div>` : ""}
    <div class="scorebox"><div><b id="cscore">${C.score}</b><span>Score</span></div><div><b>${C.miss}</b><span>Erreurs</span></div><div><b>${save.coordBest}</b><span>Record</span></div></div>
    ${done ? `<div class="fb ${done.c}">${done.t}</div>` : ""}
    ${C.running ? "" : `
      <div class="settings">
        <div class="field"><span>Vu depuis</span><div class="seg" role="group"><button aria-pressed="${C.side === "w"}" data-side="w">Les Blancs</button><button aria-pressed="${C.side === "b"}" data-side="b">Les Noirs</button></div></div>
        <div class="field"><span>Aide</span><label class="switch"><input type="checkbox" id="ccoords" ${C.coords ? "checked" : ""}> Afficher les coordonnées</label></div>
      </div>
      <div class="row"><button class="btn primary" id="cstart">${done ? "Rejouer" : "Démarrer"}</button></div>`}`;
  panel.querySelectorAll("[data-side]").forEach(b => b.onclick = () => { C.side = b.dataset.side; B.flip = C.side === "b"; render(); coordPanel(); });
  const cc = $("#ccoords"); if (cc) cc.onchange = e => { C.coords = e.target.checked; B.coords = C.coords; render(); };
  const cs = $("#cstart"); if (cs) cs.onclick = coordStart;
}
function coordStart() {
  C.running = true; C.score = 0; C.miss = 0; C.target = null; newTarget();
  C.end = Date.now() + DURATION;
  coordPanel();
  C.iv = setInterval(() => {
    const left = C.end - Date.now();
    const bar = $("#ctimer"); if (bar) bar.style.width = Math.max(0, left / DURATION * 100) + "%";
    if (left <= 0) {
      clearInterval(C.iv); C.iv = null; C.running = false;
      const rec = C.score > save.coordBest;
      if (rec) { save.coordBest = C.score; persist(); }
      coordPanel({ c: rec ? "ok" : "info", t: rec ? `Nouveau record : ${C.score} cases !` : `${C.score} cases trouvées. Ton record : ${save.coordBest}.` });
    }
  }, 100);
}
function coordClick(sq) {
  if (!C.running) return;
  if (sqName(sq) === C.target) { C.score++; flashSq(sq, "flash-ok"); newTarget(); }
  else { C.miss++; flashSq(sq, "flash-bad"); }
  const t = $("#ctarget"); if (t) t.textContent = C.target;
  const tm = $("#ctarget-mini"); if (tm) tm.textContent = C.target;
  const s = $("#cscore"); if (s) s.textContent = C.score;
  const misses = panel.querySelectorAll(".scorebox b")[1]; if (misses) misses.textContent = C.miss;
}

setMode(["lecons", "exercices", "jouer", "coord"].includes(save.mode) ? save.mode : "lecons");
</script>
