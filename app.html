<title>Cap Calisthénie</title>
<meta name="description" content="Programmes de calisthénie sur mesure : arbres de compétences, cycles de 12 semaines et séances guidées.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: en-tête avec les deux objectifs, puis onglets ; la vue Semaine empile frise des 26 semaines → grille des 7 jours → détail de la séance. */
:root {
  --bg: #eef2f0;
  --surface: #ffffff;
  --sunk: #e3e9e6;
  --ink: #14201c;
  --muted: #5a6964;
  --line: #d2dbd7;
  --accent: #0b7a63;
  --accent-soft: #d5ece5;
  --on-accent: #ffffff;
  --p1: #3f74c9;
  --p2: #0b8f75;
  --p3: #c98a1c;
  --p4: #cf4a3c;
  --p5: #7a4fc4;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #16201d; --sunk: #1d2925; --ink: #e4ece9; --muted: #92a29c;
    --line: #2a3733; --accent: #3cc4a3; --accent-soft: #173a32; --on-accent: #06221b;
    --p1: #6d9be6; --p2: #3cc4a3; --p3: #e2a945; --p4: #ec7465; --p5: #a583e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #16201d; --sunk: #1d2925; --ink: #e4ece9; --muted: #92a29c;
  --line: #2a3733; --accent: #3cc4a3; --accent-soft: #173a32; --on-accent: #06221b;
  --p1: #6d9be6; --p2: #3cc4a3; --p3: #e2a945; --p4: #ec7465; --p5: #a583e6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(34px, 6vw, 52px); font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }
h2 { font-size: 26px; font-weight: 600; }
h3 { font-size: 21px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* En-tête */
header { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: end; justify-content: space-between; }
header .intro { display: grid; gap: 6px; min-width: 0; max-width: 60ch; }
.start { display: grid; gap: 4px; }
.start input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }

/* Sélecteur de programme */
.prog-switch { display: inline-flex; gap: 2px; padding: 3px; background: var(--sunk); border-radius: 10px; justify-self: start; margin-bottom: 6px; }
.prog-switch button { border: 0; background: transparent; padding: 6px 16px; border-radius: 8px; font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.prog-switch button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 18%, transparent); }
.log select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }

/* Objectifs */
.goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; }
.goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.goal-big { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.goal-big small { font-size: 18px; color: var(--muted); font-weight: 500; }
.track { position: relative; height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.track > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.track-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Onglets */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 14px; font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* Frise des semaines */
.timeline { display: grid; gap: 8px; }
.weeks { display: grid; grid-template-columns: repeat(26, minmax(0, 1fr)); gap: 12px 3px; }
.wk { position: relative; border: 0; border-radius: 5px; height: 42px; padding: 0; background: color-mix(in srgb, var(--pc) 22%, var(--surface)); color: var(--ink); font-family: var(--font-display); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.wk.deload { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--pc) 22%, var(--surface)) 0 4px, var(--surface) 4px 8px); }
.wk.sel { background: var(--pc); color: var(--surface); }
.wk.now::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--pc); display: inline-block; }
.legend i.stripe { background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 4px); }

/* En-tête de semaine */
.week-head { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; align-items: end; }
.week-head .info { display: grid; gap: 4px; min-width: 0; max-width: 64ch; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; background: color-mix(in srgb, var(--pc) 18%, var(--surface)); color: var(--ink); border: 1px solid color-mix(in srgb, var(--pc) 45%, var(--surface)); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
.nav { display: flex; gap: 6px; }
.nav button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; }
.nav button:disabled { opacity: .4; cursor: default; }

/* Jours */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 10px 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.day.rest { background: transparent; border-style: dashed; }
.day.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day .d { display: flex; justify-content: space-between; align-items: center; }
.day .d b { font-family: var(--font-display); font-size: 18px; text-transform: uppercase; letter-spacing: .04em; }
.day .t { font-weight: 600; line-height: 1.25; }
.day .s { font-size: 13px; color: var(--muted); line-height: 1.35; }
.check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-grid; place-items: center; font-size: 12px; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tag-var { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 4px; justify-self: start; }
.defi { background: var(--accent-soft); border-radius: 8px; padding: 4px 14px 2px; }
.defi .ex-row .fig { background: var(--surface); }
.tag-test { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--p4); }

/* Détail séance */
.session { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 16px; }
.session-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: start; }
.session-head .info { display: grid; gap: 4px; min-width: 0; max-width: 64ch; }
.done-btn { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.done-btn.on { background: var(--accent); color: var(--on-accent); }
.blocks { display: grid; gap: 4px; }
.block-title { margin-top: 6px; }
.ex-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.ex-row:first-of-type { border-top: 0; }
.ex-row .fig { width: 150px; height: 125px; background: var(--sunk); border-radius: 8px; }
.ex-row .txt { display: grid; gap: 4px; min-width: 0; }
.ex-row .name { font-weight: 600; font-size: 16px; }
.ex-row .note { font-size: 14px; color: var(--muted); }
.ex-row .cues { margin: 2px 0 0; padding-left: 18px; font-size: 14px; }
.dose { text-align: right; display: grid; gap: 2px; justify-items: end; }
.dose b { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dose span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.log { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; padding: 14px; background: var(--accent-soft); border-radius: 8px; }
.log label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
.log input { width: 120px; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.rest-card { display: grid; gap: 8px; }

/* Bibliothèque */
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; }
.card .fig { width: 100%; aspect-ratio: 6 / 5; height: auto; max-width: 100%; background: var(--sunk); border-radius: 8px; }
.card ul { margin: 0; padding-left: 18px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); }

/* Progression */
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.phase { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--pc); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; align-content: start; }
.chart-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.chart-scroll { overflow-x: auto; }
.chart-scroll svg { display: block; min-width: 560px; width: 100%; height: auto; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.rules .card p { font-size: 14px; }


/* Skills */
.trees { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.tree { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; align-content: start; }
.tree.focus { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tree-head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.tree .fig { width: 100%; aspect-ratio: 6 / 5; height: auto; max-width: 100%; background: var(--sunk); border-radius: 8px; }
.tree-now { display: grid; gap: 2px; }
.tree-now b { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.1; }
.tree-now .muted { font-size: 14px; }
.star { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.star.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.segs { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 3px; }
.segs i { height: 8px; border-radius: 3px; background: var(--sunk); }
.segs i.on { background: var(--accent); }
.segs i.cur { background: repeating-linear-gradient(135deg, var(--accent) 0 3px, var(--accent-soft) 3px 6px); }
.tree-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 8px 12px; color: var(--ink); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 8px; }
.steps button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; background: none; border: 0; padding: 6px 4px; border-radius: 6px; }
.steps button:hover { background: var(--sunk); }
.steps .dot { width: 24px; height: 24px; flex: none; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--sunk); color: var(--muted); }
.steps li.ok .dot { background: var(--accent); color: var(--on-accent); }
.steps li.cur .dot { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.steps b { display: block; font-weight: 600; font-size: 14px; }
.steps small { font-size: 12px; }
.validate-btn { margin-top: 4px; justify-self: start; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 13px; }

/* Réglages du programme sur mesure */
.cu-set { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.cu-col { display: grid; gap: 6px; min-width: 0; }
.chips-sel { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 14px; font-weight: 500; }
.chip-btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunk); border-radius: 8px; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 5px 14px; font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); }
.cu-set input { width: 90px; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.lvl-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px 24px; }
.lvl { display: grid; gap: 6px; }
.lvl-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; flex-wrap: wrap; }
.journal { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.session-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.play-btn { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 8px 14px; font-weight: 600; }

/* Séance guidée */
.player { position: fixed; inset: 0; z-index: 50; background: var(--bg); color: var(--ink); overflow-y: auto; display: grid; grid-template-rows: auto 1fr;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.pl-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; max-width: 760px; width: 100%; margin: 0 auto; }
.pl-prog { flex: 1 1 160px; height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.pl-prog i { display: block; height: 100%; background: var(--accent); }
.pl-body { max-width: 760px; width: 100%; margin: 0 auto; display: grid; gap: 14px; align-content: start; justify-items: center; text-align: center; padding-top: 12px; }
.pl-stage { width: min(100%, 420px); }
.pl-fig { width: 100%; height: auto; aspect-ratio: 6 / 5; background: var(--sunk); border-radius: 12px; }
.pl-info { display: grid; gap: 4px; justify-items: center; }
.pl-info h2 { font-size: clamp(24px, 5vw, 34px); }
.pl-what { font-size: 22px; font-weight: 600; }
.pl-clock-wrap { --p: 0; width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(closest-side, var(--bg) 82%, transparent 83%), conic-gradient(var(--accent) calc(var(--p) * 360deg), var(--sunk) 0); }
.pl-clock-wrap.resting { background: radial-gradient(closest-side, var(--bg) 82%, transparent 83%), conic-gradient(var(--p3) 360deg, var(--p3) 0); }
.pl-clock { font-size: 52px; font-weight: 700; }
.pl-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.pl-main { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 14px 26px; font-size: 18px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .pl-clock-wrap { transition: none; } }

/* Figures */
.fig .pr { stroke: var(--muted); stroke-width: 2; fill: none; }
.fig .prf { fill: var(--line); stroke: var(--muted); stroke-width: 1.5; }
.fig .lb { stroke: var(--ink); stroke-linecap: round; stroke-width: 7; opacity: .35; }
.fig .lf { stroke: var(--ink); stroke-linecap: round; stroke-width: 7; }
.fig .tr { stroke: var(--ink); stroke-linecap: round; stroke-width: 10; }
.fig .hd { fill: var(--ink); }

@media (max-width: 860px) {
  .days { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .weeks { grid-template-columns: repeat(13, minmax(0, 1fr)); row-gap: 12px; }
}
@media (max-width: 560px) {
  .days { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ex-row { grid-template-columns: 110px minmax(0, 1fr); }
  .ex-row .fig { width: 110px; height: 92px; }
  .dose { grid-column: 2; justify-items: start; text-align: left; }
  .dose b { font-size: 24px; }
}
</style>

<div class="wrap">
  <header>
    <div class="intro">
      <div class="prog-switch" role="tablist" aria-label="Programme">
        <button role="tab" data-prog="cu">Sur mesure</button>
        <button role="tab" data-prog="hs">Handstand</button>
        <button role="tab" data-prog="pl">Planche</button>
      </div>
      <span class="label" id="eyebrow"></span>
      <h1 id="prog-title">Cap Handstand</h1>
      <p class="muted" id="prog-intro"></p>
    </div>
    <label class="start">
      <span class="label">Début du programme (un lundi)</span>
      <input type="date" id="start-date">
    </label>
  </header>

  <section class="goals" id="goals" aria-label="Objectifs"></section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="week" aria-selected="true">Semaine</button>
    <button role="tab" data-tab="skills" aria-selected="false">Skills</button>
    <button role="tab" data-tab="plan" aria-selected="false" id="plan-tab">Progression</button>
    <button role="tab" data-tab="lib" aria-selected="false">Exercices</button>
  </nav>

  <main id="view"></main>
</div>

<script>
/* ---------- Exercices : poses (coordonnées viewBox 240×200, sol y=190) ---------- */
const EX = {
  wrists: {
    name: "Préparation poignets", short: "Bascule à quatre pattes",
    desc: "À quatre pattes, mains sous les épaules, doigts écartés. Bascule doucement les épaules au-delà des doigts puis reviens.",
    cues: ["Doigts bien écartés, pression dans le bout des doigts", "Bras tendus, mouvement lent", "Ajoute 10 rotations de poignets avant"],
    props: [],
    poses: [
      { h:[100,190], e:[101,168], s:[102,146], p:[146,148], k:[150,190], f:[188,190], hd:[90,141] },
      { h:[100,190], e:[94,170], s:[88,150], p:[134,150], k:[150,190], f:[188,190], hd:[76,145] }
    ],
    seq: [[0,.4,1.2],[1,.6,1.2]]
  },
  bearCrawl: {
    name: "Bear crawl", short: "Marche de l'ours",
    desc: "À quatre pattes, genoux décollés de 3 cm du sol. Avance main droite et pied gauche en même temps, puis l'autre côté, sans que les genoux ne remontent. Gainage, épaules et poignets en un seul exercice.",
    cues: ["Genoux à 3 cm du sol tout du long", "Dos plat : un verre d'eau ne tomberait pas", "Petits pas, avant puis arrière"],
    props: [],
    poses: [

function phaseIndex(w) { return PHASES.findIndex(p => w >= p.from && w <= p.to); }
function rampT(w) {
  const p = PHASES[phaseIndex(w)];
  const last = DELOAD.has(p.to) ? p.to - 1 : p.to;
  if (last === p.from) return 0;
  return Math.min(1, (w - p.from) / (last - p.from));
}
const R = (a, b, t) => Math.round(a + (b - a) * t);
function fmtS(s) { if (s < 60) return s + " s"; const m = Math.floor(s / 60), r = s % 60; return m + " min" + (r ? " " + String(r).padStart(2, "0") : ""); }

function targetAt(w, key) {
  // interpolation linéaire entre les jalons de fin de phase
  const pts = [[0, START[key]]].concat(PHASES.map(p => [p.to, p[key]]));
  for (let i = 1; i < pts.length; i++) {
    const [w0, v0] = pts[i - 1], [w1, v1] = pts[i];
    if (w <= w1) return v0 + (v1 - v0) * (w - w0) / (w1 - w0);
  }
  return pts[pts.length - 1][1];
}

function item(ex, dose, unit, note) { return { ex, dose, unit, note }; }

function hsBaseSession(w, type) {
  const pi = phaseIndex(w), t = rampT(w), dl = DELOAD.has(w);

  let main = [];
  const holdTarget = Math.round(targetAt(w, "hold") / 5) * 5;

  if (type === "forceA") {
    if (pi === 0) main = [
      item("pikeBox", S(4) + " × " + R(6, 10, t), "repos 2 min", "Pieds à hauteur de hanches"),
      item("hspu", S(4) + " × " + R(1, 3, t), "repos 2 min", "Coussin fin, tête en triangle avec les mains"),

      item("dipsW", S(4) + " × " + R(5, 8, t), "lestés", "Charge pour finir à 2 répétitions de l'échec")
    ];
    else if (pi === 1) main = [
      item("wallWalk", "2 × 1", "échauffement", "Prépare les épaules à la verticale"),

    ];
    else if (pi === 2) main = [
      item("hspu", S(5) + " × " + R(5, 7, t), "repos 2–3 min", "Garde 1 à 2 répétitions en réserve"),
      item("hspuDef", S(4) + " × " + R(3, 5, t), "repos 2 min", "Déficit de 5 à 8 cm"),

function buildSession(w, type) {
  const s = PROG.base(w, type);
  if (s.test) return s;
  const pi = phaseIndex(w), si = SLOT_ORDER.indexOf(type);
  const v = (DELOAD.has(w) || w >= PROG.peakFrom) ? 0 : (w - 1 + si) % 3;
  const V = VARIANTS[type][v];
  const swap = it => {
    const to = V.swap && V.swap[it.ex];
    if (!to || (EX[to].minPhase || 0) > pi) return it;
    return Object.assign({}, it, { ex: to, note: EX[to].swapNote || it.note });
  };
  s.warm = s.warm.map(swap);
  s.main = s.main.map(swap);
  if (V.warmAdd) s.warm.push(V.warmAdd());
  if (V.ladder) {
    const i = s.main.findIndex(it => /^\d+ × \d+$/.test(it.dose) && +it.dose.split(" × ")[1] >= 3);
    if (i >= 0) {
      const [a, reps] = s.main[i].dose.split(" × ").map(Number);
      const b = Math.min(5, reps);
      const k = Math.max(1, Math.round(a * reps / (b * (b + 1) / 2)));
      s.main[i] = Object.assign({}, s.main[i], { dose: "1→" + b + (k > 1 ? " × " + k : ""), unit: "échelle", note: "1 rép., 20 s de repos, 2 rép.… jusqu'à " + b + ". " + (k > 1 ? "Repos 2 min, " : "") + (k > 1 ? "puis recommence (" + k + " échelles au total)" : "une seule échelle") });
    }
  }
  if (V.superset && s.main.length >= 3) {
    const n = s.main.length;
    s.main[n - 2] = Object.assign({}, s.main[n - 2], { unit: "superset A", note: "Enchaîne directement avec l'exercice suivant" });
    s.main[n - 1] = Object.assign({}, s.main[n - 1], { unit: "superset B", note: "Puis 90 s de repos et on repart sur A" });
  }
  if (V.circuit) {
    s.main = s.main.map(it => (it.dose.startsWith("EMOM") || it.unit === "cumulées") ? it : Object.assign({}, it, { dose: it.dose.split(" × ").pop(), unit: "circuit · " + (it.dose.includes(" × ") ? it.dose.split(" × ")[0] : 3) + " tours" }));
  }
  if (V.hsNote) s.main = s.main.map(it => it.ex === "hsFree" ? Object.assign({}, it, { note: V.hsNote }) : it);
  if (V.cluster && s.main.length) {
    const it = s.main[0], m = it.dose.match(/^(\d+) × (\d+) s$/);
    if (m) { const hs = Math.max(2, Math.ceil(+m[2] * 0.5)); s.main[0] = Object.assign({}, it, { dose: m[1] + " × (3 × " + hs + " s)", unit: "clusters", note: "3 tenues de " + hs + " s séparées de 10 s de repos = 1 série. Repos 2–3 min entre les séries" }); }
  }
  if (V.add) s.main.push(V.add(w));
  s.variant = V;
  const inSession = new Set(s.warm.concat(s.main).map(it => it.ex));
  const pool = DEFIS.filter(d => d.min <= pi && !inSession.has(d.ex));
  s.defi = pool.length ? pool[(w * 5 + si * 3) % pool.length] : null;
  return s;
}

function leverPose(kind, mode) {
  // c = côté de la poitrine : +1 vers le sol (planche, back lever), -1 vers la barre (front lever)
  const c = mode === "fl" ? -1 : 1;
  const s = mode === "pl" ? [98, 128] : [92, 96];
  const hnd = mode === "pl" ? [108, 168] : [mode === "bl" ? 106 : 100, 50];

  const P = { s, p, h: hnd, e: [(s[0] + hnd[0]) / 2, (s[1] + hnd[1]) / 2], hd: [s[0] - 13, s[1] - 2 * c] };

  const adv = () => ({ k: [p[0] - 12, p[1] + c * 32], f: [p[0] + 18, p[1] + c * 26] });
  if (kind === "tuck") Object.assign(P, tuck());
  if (kind === "adv") Object.assign(P, adv());
  if (kind === "one") { const a = adv(); Object.assign(P, { k: [p[0] + 36, p[1]], f: [p[0] + 70, p[1]], k2: a.k, f2: a.f }); }
  if (kind === "straddle") Object.assign(P, { k: [p[0] + 34, p[1]], f: [p[0] + 66, p[1]], k2: [p[0] + 32, p[1] + c * 9], f2: [p[0] + 62, p[1] + c * 18] });
  if (kind === "half") Object.assign(P, { k: [p[0] + 34, p[1]], f: [p[0] + 36, p[1] + c * 32] });
  if (kind === "full") Object.assign(P, { k: [p[0] + 36, p[1]], f: [p[0] + 72, p[1]] });
  return P;
}

function leverEx(kind, mode, name, short, desc, cues) {
  const P = leverPose(kind, mode);

  const it = player.list[player.i], ex = EX[it.ex], rx = player.rx, N = player.list.length;
  const top = h("div", { class: "pl-top" },
    h("button", { class: "ghost", onclick: closePlayer }, "✕ Quitter"),
    h("span", { class: "label" }, "Exercice " + (player.i + 1) + "/" + N),
    h("div", { class: "pl-prog" }, h("i", { style: "width:" + ((player.i + (player.phase === "done" ? 1 : 0)) / N * 100) + "%" })));
  if (player.phase === "done") {
    o.replaceChildren(top, h("div", { class: "pl-body" },
      h("h2", null, "Séance terminée"),
      h("p", { class: "muted" }, N + " exercices bouclés. Pense à valider un palier si tu as réussi un standard."),
      h("button", { class: "pl-main", onclick: () => { state.done[player.key] = true; store.set("done", state.done); closePlayer(); render(); } }, "✓ Marquer comme faite")));
    return;
  }
  const what = rx.mode === "hold" ? (rx.cluster ? "Tenue de " + rx.secs + " s (cluster)" : "Tenue de " + fmtS(rx.secs)) : rx.mode === "reps" ? it.dose.split(" × ")[1] + " répétitions" : rx.mode === "emom" ? (it.unit || "") + " · minute " + player.set + "/" + rx.sets : rx.mode === "timer" ? fmtS(rx.secs) : it.dose + (it.unit ? " · " + it.unit : "");
  const fig = makeFigure(it.ex, "pl-fig");
  let clock = "", btns = [], sub = "";
  if (player.phase === "rest") {
    clock = fmtClock(Math.ceil(player.restFor - (Date.now() - player.t0) / 1000));
    sub = player.newEx ? "Repos · ensuite : " + (it.title || ex.name) : "Repos avant la série " + player.set;
    btns = [h("button", { class: "pl-main", onclick: () => { player.phase = "ready"; player.newEx = false; drawPlayer(); } }, "Passer le repos"),
      h("button", { class: "ghost", onclick: () => { player.restFor += 15; } }, "+15 s")];
  } else if (player.phase === "ready") {
    clock = rx.mode === "hold" ? fmtClock(0) : rx.mode === "timer" ? fmtClock(rx.secs) : "";
    sub = "Série " + player.set + "/" + rx.sets;
    if (rx.mode === "hold") btns = [h("button", { class: "pl-main", onclick: () => { player.phase = "count"; player.t0 = Date.now(); player.reached = false; player.lastBeep = null; drawPlayer(); } }, "▶ Démarrer la tenue")];
    else if (rx.mode === "timer" || rx.mode === "emom") btns = [h("button", { class: "pl-main", onclick: () => { player.phase = rx.mode === "emom" ? "work" : "work"; player.t0 = Date.now(); if (rx.mode === "emom") { player.set = 1; beep(880, .25); } drawPlayer(); } }, rx.mode === "emom" ? "▶ Lancer l'EMOM" : "▶ Lancer le chrono")];
    else btns = [h("button", { class: "pl-main", onclick: nextStep }, "✓ Série faite")];
    btns.push(h("button", { class: "ghost", onclick: () => { player.set = rx.sets; nextStep(); } }, "Passer l'exercice"));
  } else if (player.phase === "count") {
    clock = "3"; sub = "Prépare-toi";
  } else if (player.phase === "work") {
    sub = rx.mode === "emom" ? "Fais tes répétitions, puis récupère jusqu'à la minute suivante" : rx.mode === "timer" ? "En cours" : "Tiens… objectif " + fmtS(rx.secs);
    btns = [h("button", { class: "pl-main", onclick: () => { if (rx.mode === "emom") player.set = rx.sets; nextStep(); } }, rx.mode === "hold" ? "■ Fin de la tenue" : "■ Terminer")];
  }
  o.replaceChildren(top, h("div", { class: "pl-body" },
    h("div", { class: "pl-stage" }, fig),
    h("div", { class: "pl-info" },
      h("span", { class: "label" }, player.phase === "rest" ? "Récupération" : sub),
      h("h2", null, it.title || ex.name),
      h("p", { class: "pl-what num" }, what),
      it.note ? h("p", { class: "muted" }, it.note) : null),
    h("div", { id: "pl-ring", class: "pl-clock-wrap" + (player.phase === "rest" ? " resting" : ""), style: "--p:0" },
      h("span", { id: "pl-clock", class: "pl-clock num" }, clock)),
    player.phase === "rest" ? h("p", { class: "muted" }, sub) : null,
    h("div", { class: "pl-btns" }, btns)));
}

/* ---------- Démarrage ---------- */
function setProgram(id) {
  PROG = PROGRAMS[id] || PROGRAMS.cu;
  if (PROG.refresh) PROG.refresh();
  ({ phases: PHASES, start: START, tests: TEST_WEEKS, deload: DELOAD, slot: SLOT, meta: SESSION_META, variants: VARIANTS, order: SLOT_ORDER, defis: DEFIS, weeks: NW } = PROG);
  state.start = store.get("start", iso(mondayOf(new Date())));
  state.done = store.get("done", {});
  state.results = store.get("results", {});
  $("#start-date").value = state.start;
  try { localStorage.setItem("cap:prog", PROG.id); } catch (e) {}
  initPosition();
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { state.tab = b.dataset.tab; render(); }));
document.addEventListener("keydown", e => { if (e.key === "Escape" && player.on) closePlayer(); });
document.querySelectorAll(".prog-switch button").forEach(b => b.addEventListener("click", () => { if (b.dataset.prog !== PROG.id) { setProgram(b.dataset.prog); render(); } }));
const sd = $("#start-date");
sd.addEventListener("change", () => {
  if (!sd.value) return;
  state.start = iso(mondayOf(new Date(sd.value + "T12:00:00")));
  sd.value = state.start;
  store.set("start", state.start);
  initPosition(); render();
});
let savedProg = "cu";
try { savedProg = localStorage.getItem("cap:prog") || "cu"; } catch (e) {}
setProgram(savedProg);
render();
</script>
