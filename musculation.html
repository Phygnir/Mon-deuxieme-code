<style>
/* Même famille visuelle que Cap Calisthénie : mode clair imposé, une colonne d'appli (max 720 px), barre d'onglets fixe en bas.
   Accent « acier » pour distinguer l'app de muscu ; couleurs de phase pour le bloc de 12 semaines. */
:root {
  --bg: #eef1f3; --surface: #ffffff; --sunk: #e2e7eb; --ink: #141c22; --muted: #5a6670; --line: #d1d9df;
  --accent: #1d5a9c; --accent-soft: #dbe6f3; --on-accent: #ffffff; --warn: #b4532a; --warn-soft: #f6e3d9;
  --ok: #0b7a63; --ok-soft: #d5ece5;
  --ph-intro: #7f8c95; --ph-accu: #0b8f75; --ph-deload: #9aa6ad; --ph-inten: #cf4a3c; --ph-taper: #c98a1c; --ph-test: #7a4fc4;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px; --nav-h: 64px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(34px, 8vw, 46px); font-weight: 700; }
h2 { font-size: 28px; font-weight: 700; }
h3 { font-size: 21px; font-weight: 600; }
p { margin: 0; }
ul, ol { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow, .label { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

#view { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px)); }
.screen { display: grid; gap: 18px; }
.top { display: grid; gap: 6px; }
.stack { display: grid; gap: 10px; align-content: start; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }

/* Boutons */
.btn { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 12px; padding: 11px 18px; font-weight: 600; font-size: 16px; }
.btn.big { padding: 15px 24px; font-size: 18px; }

.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.armed { background: var(--warn); color: #fff; }

.link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; }

.icon-btn.armed { width: auto; padding: 0 12px; font-size: 14px; font-weight: 600; background: var(--warn); color: #fff; border-color: var(--warn); }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; display: grid; place-items: center; }
.cta { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 10px; justify-content: center; background: linear-gradient(transparent, var(--bg) 30%); z-index: 5; }
.cta .btn.big { flex: 0 1 440px; }

/* Étiquettes */
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.note-box { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.note-box.warn { background: var(--warn-soft); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 13px; font-size: 14px; font-weight: 500; }
.chip-btn.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; background: var(--sunk); border-radius: 10px; justify-self: start; }
.seg button { white-space: nowrap; border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 15%, transparent); }

/* Aujourd'hui */
.hero { gap: 12px; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }

.phase-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink); }

.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }

/* Plan */
.cycle { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; }
.cy { position: relative; height: 38px; border: 0; border-radius: 6px; padding: 0; background: color-mix(in srgb, var(--pc) 22%, var(--surface)); font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--ink); }

.cy.sel { background: var(--pc); color: var(--surface); }
.cy.now::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; background: var(--pc); display: inline-block; }
.dayrow { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; }
.dayrow .dr-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.dayrow .dr-main b { font-size: 17px; }
.dayrow .dr-main .small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Lignes d'exercice */
.xlist { display: grid; gap: 8px; }

.xmain { flex: 1; min-width: 0; display: grid; gap: 3px; }
.xname { font-size: 16px; font-weight: 600; }
.xwhy { font-size: 13px; color: var(--accent); font-weight: 500; }
.xdose { font-family: var(--font-display); font-size: 21px; font-weight: 700; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.xmore { padding: 0 12px 12px; display: grid; gap: 8px; font-size: 15px; }
.xmore ul { padding-left: 18px; }
.settbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.settbl td, .settbl th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: left; }

.role { font-family: var(--font-display); font-weight: 700; font-size: 13px; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none; }
.role.F { background: var(--ink); color: var(--bg); }
.role.H { background: var(--accent-soft); color: var(--accent); }

.role.A { background: var(--warn-soft); color: var(--warn); }

/* Exercices */
.search { font: inherit; width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
.exbtn { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; }
.exbtn .xmain b { font-size: 16px; }
.faults li::marker { content: "✕  "; color: var(--warn); }

/* Profil */
.field { display: grid; gap: 6px; min-width: 0; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.field input, .field select { font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); width: 100%; min-width: 0; }
.switch-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 4px 0; }
.switch-row > span { display: grid; gap: 2px; min-width: 0; }
.switch { appearance: none; width: 48px; height: 28px; flex: none; border-radius: 99px; background: var(--sunk); position: relative; cursor: pointer; transition: background .15s; border: 1px solid var(--line); margin: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 30%, transparent); transition: transform .15s; }
.switch:checked { background: var(--accent); border-color: var(--accent); }
.switch:checked::after { transform: translateX(20px); }
.restore { width: 100%; font: 13px/1.4 ui-monospace, Menlo, monospace; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); resize: vertical; }
.sources { padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }

/* Progrès */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 2px; min-width: 0; }
.kpi b { font-family: var(--font-display); font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
.chart .target { stroke: var(--ok); stroke-width: 1.5; stroke-dasharray: 5 5; }
.chart .tlabel { fill: var(--ok); font-size: 12px; font-weight: 600; font-family: var(--font-body); }
.chart .area { fill: color-mix(in srgb, var(--accent) 12%, transparent); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .dot.end { fill: var(--ink); }
.vol { display: grid; gap: 7px; }
.vol-row { display: grid; grid-template-columns: 86px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 14px; }
.vol-track { position: relative; height: 14px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.vol-band { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--ok) 18%, transparent); border-left: 1px dashed var(--ok); border-right: 1px dashed var(--ok); }
.vol-fill { position: absolute; left: 0; top: 3px; bottom: 3px; background: var(--accent); border-radius: 3px; }
.vol-row .num { text-align: right; font-size: 17px; font-weight: 600; }
.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.hist summary { padding: 10px 12px; display: flex; justify-content: space-between; gap: 10px; cursor: pointer; list-style: none; }
.hist summary::-webkit-details-marker { display: none; }
.hist-items { list-style: none; padding: 0 12px 12px; display: grid; gap: 4px; font-size: 14px; }
.hist-items li { display: flex; justify-content: space-between; gap: 10px; }
.hist-items li span:last-child { text-align: right; font-variant-numeric: tabular-nums; }

/* Barre d'onglets */
#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

.nav-btn.on { color: var(--accent); }

/* Séance guidée */
.player { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); }
.p-top { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.p-prog { flex: 1; display: grid; gap: 4px; justify-items: center; font-size: 15px; font-weight: 600; min-width: 0; }
.p-prog .bar { width: 100%; height: 5px; }

.p-body > * { width: 100%; }
.p-info { display: grid; gap: 4px; justify-items: center; }

.stepper .icon-btn { width: 44px; height: 44px; font-size: 24px; }

.rpe-row button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rpe-row button.tgt { box-shadow: inset 0 -3px 0 var(--accent); }
.done-sets { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }

.p-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.p-ring { --p: 0; width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; justify-self: center;
  background: radial-gradient(closest-side, var(--bg) 86%, transparent 87%), conic-gradient(var(--ph-taper) calc(var(--p) * 360deg), var(--sunk) 0); }

.stats b { font-family: var(--font-display); font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; color: var(--muted); }

.res li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }

<script>
"use strict";
/* =====================================================================
   Cap Muscu — moteur
   Sources : E. Helms, The Muscle & Strength Pyramid: Training (2e éd.) —
   volume 10-20 séries/muscle/semaine, chaque muscle ≥ 2×/semaine, RPE par
   réserve de répétitions, bloc accumulation → décharge → intensification →
   affûtage → test, double progression sur l'isolation, -10 % après deux
   séances ratées. A. Schwarzenegger, The New Encyclopedia of Modern
   Bodybuilding — choix d'exercices et consignes d'exécution.
   ===================================================================== */

const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "html") n.innerHTML = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : String(c));
  return n;
}
const kg = n => (Math.round(n * 100) / 100).toLocaleString("fr-FR", { maximumFractionDigits: 2 });
const rpeTxt = r => String(r).replace(".", ",");
const rnd = (x, inc) => Math.round(x / inc) * inc;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fmtDate = ts => new Date(ts).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });

/* % du 1RM selon les répétitions jusqu'à l'échec (reps + réserve) */
const RTF = [100, 100, 95.5, 92.2, 89.2, 86.3, 83.7, 81.1, 78.6, 76.2, 73.9, 71.7, 69.4, 67.6, 65.6, 63.8, 62, 60.3, 58.7, 57.1, 55.6];
function pct(reps, rpe) {
  const x = Math.max(1, reps + (10 - (rpe || 10)));
  if (x >= 20) return Math.max(35, 55.6 - (x - 20) * 1.4) / 100;
  const a = Math.floor(x), f = x - a;
  return (RTF[a] + (RTF[a + 1] - RTF[a]) * f) / 100;
}

/* ---------- État et sauvegarde ---------- */
const KEY = "muscu:state";
function defaults() {
  return {
    v: 1, upd: 0,
    settings: { bw: 65, days: 4, years: 4, autoreg: true, sound: true, swap: {} },
    goals: { bench: { to: 112.5, from: 105 }, squat: { to: 135, from: 125 }, deadlift: { to: 170, from: 160 }, pullup: { to: 57.5, from: 50 }, pushups: { to: 80, from: 70 } },
    st: {},
    block: { cycle: 1, week: 1, done: [] },
    logs: []
  };
}
let STATE = defaults();
try { const raw = localStorage.getItem(KEY); if (raw) STATE = Object.assign(defaults(), JSON.parse(raw)); } catch (e) {}
const SYNC = { db: null, base: null, status: "local", t: null };

function stOf(id) {
  const e = EX[id];
  if (!STATE.st[id]) STATE.st[id] = { e1: e.e1 ? (e.bw ? e.e1 - 65 + STATE.settings.bw : e.e1) : 0, miss: 0, reset: false, best: e.amrap ? e.ini : 0, hist: [] };
  return STATE.st[id];
}
const bw = () => STATE.settings.bw;
const toDisp = (id, total) => EX[id].bw ? total - bw() : total;
const toTot = (id, w) => EX[id].bw ? w + bw() : w;
function loadTxt(id, w) {
  const e = EX[id];
  if (e.amrap) return "Max";
  if (e.bw || e.pdc) return w > 0 ? "+" + kg(w) + " kg" : "PDC";
  return kg(w) + " kg" + (e.db ? " /halt." : "");
}

function persistLocal() { try { localStorage.setItem(KEY, JSON.stringify(STATE)); } catch (e) {} }
function save() {
  STATE.upd = Date.now();
  persistLocal();
  if (SYNC.db) { clearTimeout(SYNC.t); SYNC.t = setTimeout(pushState, 700); }
}
function stateBody() { const { logs, ...rest } = STATE; return JSON.parse(JSON.stringify(rest)); }
async function pushState() {
  if (!SYNC.db) return;
  try { await SYNC.db.doc(SYNC.base + "/state").set(stateBody()); SYNC.status = "cloud"; }
  catch (e) { SYNC.status = "erreur"; }
}
async function pushLog(L) { if (!SYNC.db) return; try { await SYNC.db.doc(SYNC.base + "/" + L.id).set(L); } catch (e) {} }
async function initSync() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    SYNC.db = db; SYNC.base = "data/users/" + uid;
    const snap = await db.collection(SYNC.base).get();
    let remote = null; const rlogs = [];
    snap.docs.forEach(d => { if (d.id === "state") remote = d.data(); else if (d.id.startsWith("L")) rlogs.push(d.data()); });
    const have = new Set(STATE.logs.map(l => l.id));
    rlogs.forEach(l => { if (!have.has(l.id)) STATE.logs.push(l); });
    STATE.logs.sort((a, b) => a.ts - b.ts);
    if (remote && (remote.upd || 0) > (STATE.upd || 0)) Object.assign(STATE, remote);
    else await pushState();
    const rIds = new Set(rlogs.map(l => l.id));
    for (const l of STATE.logs) if (!rIds.has(l.id)) await pushLog(l);
    SYNC.status = "cloud"; persistLocal(); render();
  } catch (e) { SYNC.status = "local"; }
}

/* ---------- Construction d'une séance ---------- */
const days = () => SPLITS[STATE.settings.days] || SPLITS[4];
const weekDef = w => WEEKS[clamp(w, 1, 12) - 1];
function exFor(dayKey, i) { const sw = STATE.settings.swap[dayKey + ":" + i]; return sw && EX[sw] ? sw : DAY[dayKey].s[i][0]; }
function lastItem(id) {
  for (let i = STATE.logs.length - 1; i >= 0; i--) { const it = STATE.logs[i].items.find(x => x.ex === id && x.sets.length); if (it) return it; }
  return null;
}
function buildItem(id, role, W) {
  const e = EX[id], s = stOf(id), last = lastItem(id);
  const it = { ex: id, role, sets: [], warm: [], goal: "", warn: false };
