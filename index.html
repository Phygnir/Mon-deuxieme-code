<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Cap Calisthénie</title>
<meta name="description" content="Programme de calisthénie sur mesure : arbres de skills, cycles de 12 semaines et séances guidées.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Thème : mode clair imposé, quel que soit le réglage de l'appareil.
   Layout : une colonne d'appli (max 720 px) centrée, barre d'onglets fixe en bas, écrans empilés en cartes. */
:root {
  --bg: #eef2f0; --surface: #ffffff; --sunk: #e3e9e6; --ink: #14201c; --muted: #5a6964; --line: #d2dbd7;
  --accent: #0b7a63; --accent-soft: #d5ece5; --on-accent: #ffffff; --warn: #b4532a; --warn-soft: #f6e3d9;
  --p1: #3f74c9; --p2: #0b8f75; --p3: #c98a1c; --p4: #cf4a3c; --p5: #7a4fc4;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px; --nav-h: 64px; --fig: var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body.locked { overflow: hidden; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(34px, 8vw, 46px); font-weight: 700; }
h2 { font-size: 28px; font-weight: 700; }
h3 { font-size: 21px; font-weight: 600; }
p { margin: 0; }
ul, ol { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.center { text-align: center; }
.eyebrow, .label { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

#view { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 18px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); }
.screen { display: grid; gap: 18px; }
.screen.with-cta { padding-bottom: 90px; }
.top { display: grid; gap: 6px; }
.stack { display: grid; gap: 10px; align-content: start; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.card.left { text-align: left; }

/* Boutons */
.btn { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 12px; padding: 11px 18px; font-weight: 600; font-size: 16px; }
.btn.big { padding: 15px 24px; font-size: 18px; }
.btn.small { padding: 7px 12px; font-size: 14px; border-radius: 9px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.armed { background: var(--warn); color: #fff; border-color: var(--warn); }
.btn.danger { color: var(--warn); }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; }
.back { justify-self: start; border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 16px; padding: 4px 0; }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; display: grid; place-items: center; }
.icon-btn.armed { width: auto; padding: 0 12px; font-size: 14px; font-weight: 600; background: var(--warn); color: #fff; border-color: var(--warn); }
.ghost-sp { visibility: hidden; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.cta { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); padding: 12px 16px; display: flex; gap: 10px; justify-content: center; background: linear-gradient(transparent, var(--bg) 30%); z-index: 5; }
.cta .btn { white-space: nowrap; }
.cta .btn.big { flex: 0 1 420px; }
.cta .btn.ghost { background: var(--surface); }

/* Étiquettes (un seul composant) */
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.ok { background: var(--accent); color: var(--on-accent); }
.note-box { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }

/* Puces de filtre */
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 13px; font-size: 14px; font-weight: 500; }
.chip-btn.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunk); border-radius: 10px; justify-self: start; }
.seg button { white-space: nowrap; border: 0; background: transparent; border-radius: 8px; padding: 6px 14px; font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 15%, transparent); }

/* Figures */
.thumb { width: 64px; height: 54px; flex: none; border-radius: 10px; background: var(--sunk); overflow: hidden; }
.thumb.sm { width: 76px; height: 64px; }
.thumb.xs { width: 48px; height: 40px; border-radius: 8px; }
.thumb .fig { width: 100%; height: 100%; display: block; }
.big-fig { width: 100%; max-width: 100%; background: var(--sunk); border-radius: var(--r); overflow: hidden; }
.big-fig.card { padding: 0; }
.big-fig .fig { width: 100%; height: auto; aspect-ratio: 6 / 5; display: block; }
.fig .pr { stroke: var(--muted); stroke-width: 2; fill: none; }
.fig .prf { fill: var(--line); stroke: var(--muted); stroke-width: 1.5; }
.fig .lb { stroke: var(--fig); stroke-linecap: round; stroke-width: 7; opacity: .35; }
.fig .lf { stroke: var(--fig); stroke-linecap: round; stroke-width: 7; }
.fig .tr { stroke: var(--fig); stroke-linecap: round; stroke-width: 10; }
.fig .hd { fill: var(--fig); }
.fig .jf { fill: var(--fig); }
.fig .jb { fill: var(--fig); opacity: .35; }
.fig .jn { fill: var(--sunk); stroke: var(--fig); stroke-width: 1.5; }
.fig .lf, .fig .lb { stroke-width: 7.5; }
.fig .tr { stroke-width: 12; }
.segs { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 3px; }
.segs i { height: 6px; border-radius: 3px; background: var(--sunk); }
.segs i.on { background: var(--accent); }
.segs i.cur { background: repeating-linear-gradient(135deg, var(--accent) 0 3px, var(--accent-soft) 3px 6px); }

/* Aujourd'hui */
.weekstrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.ws-day { border: 0; background: none; display: grid; justify-items: center; gap: 4px; padding: 4px 0; }
.ws-l { font-size: 12px; font-weight: 600; color: var(--muted); }
.ws-dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--muted); background: transparent; }
.ws-day.train .ws-dot { background: var(--sunk); color: var(--ink); }
.ws-day.ok .ws-dot { background: var(--accent); color: var(--on-accent); }
.ws-day.today .ws-dot { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.ws-day.today .ws-l { color: var(--accent); }
.hero { gap: 10px; border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.hero h2 { font-size: 34px; }
.hero.rest { border-color: var(--line); }
.mini { list-style: none; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.mini li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.mini li b { font-size: 18px; white-space: nowrap; }
.next { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.next > b { font-size: 18px; }
.prio-list { display: grid; gap: 8px; }
.prio, .tcard { display: flex; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px; width: 100%; }
.prio-txt, .tc-txt { display: grid; gap: 3px; flex: 1; min-width: 0; }
.prio-txt b, .tc-txt b { font-size: 17px; }
.journal { padding-left: 18px; display: grid; gap: 4px; font-size: 15px; }

/* Plan */
.cycle { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; }
.cy { position: relative; height: 38px; border: 0; border-radius: 6px; padding: 0; background: color-mix(in srgb, var(--pc) 20%, var(--surface)); font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--ink); }
.cy.dl { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--pc) 20%, var(--surface)) 0 4px, var(--surface) 4px 8px); }
.cy.sel { background: var(--pc); color: var(--surface); }
.cy.now::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; background: var(--pc); display: inline-block; }
.legend i.stripe { background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 4px); }
.phase-txt { display: grid; gap: 2px; }
.daylist { display: grid; gap: 6px; }
.dayrow { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; }
.dayrow.rest { background: transparent; border-style: dashed; padding: 8px 12px; }
.dayrow.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dr-date { width: 54px; flex: none; display: grid; }
.dr-date b { font-family: var(--font-display); font-size: 18px; text-transform: uppercase; }
.dr-date span { font-size: 12px; color: var(--muted); }
.dr-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.dr-main b { font-size: 17px; }
.dr-main .small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-end { display: flex; align-items: center; gap: 8px; }
.chev { font-size: 22px; color: var(--muted); }

/* Lignes d'exercice */
.xlist { display: grid; gap: 8px; }
.xrow { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.xrow.defi { background: var(--accent-soft); border-color: transparent; }
.xrow summary { list-style: none; display: flex; gap: 12px; align-items: center; padding: 10px; cursor: pointer; }
.xrow summary::-webkit-details-marker { display: none; }
.xmain { flex: 1; min-width: 0; display: grid; gap: 3px; }
.xname { font-size: 16px; font-weight: 600; }
.last { font-size: 13px; color: var(--accent); font-weight: 500; }
.xdose { font-size: 24px; font-weight: 700; white-space: nowrap; text-align: right; }
.xmore { padding: 0 12px 12px 86px; display: grid; gap: 8px; font-size: 15px; }
.xmore ul { padding-left: 18px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Skills */
.tree-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.tcard.focus { border-color: var(--accent); }
.tree-hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; }
.std { display: grid; gap: 0; }
.std b { font-size: 26px; }
.steps { list-style: none; padding: 0; display: grid; gap: 6px; }
.steps li { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.steps li.ok { opacity: .7; }
.steps li.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.st-txt { flex: 1; min-width: 0; display: grid; }

/* Exercices */
.search { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ex-card { display: grid; gap: 4px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 8px 10px; align-content: start; }
.ex-card .thumb { width: 100%; height: auto; aspect-ratio: 6 / 5; }
.ex-card b { font-size: 15px; line-height: 1.2; }
.cues-list { padding-left: 20px; display: grid; gap: 4px; }
.gloss { margin: 0; display: grid; gap: 2px; }
.gloss dt { font-weight: 600; margin-top: 8px; }
.gloss dd { margin: 0; color: var(--muted); font-size: 15px; }

/* Profil */
.field { display: grid; gap: 6px; }
.field-row { display: flex; flex-wrap: wrap; gap: 14px; }
.field input { font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); max-width: 200px; }
.how { padding-left: 20px; display: grid; gap: 8px; font-size: 15px; }

/* Bilan */
.onb { gap: 16px; padding-bottom: 20px; }
.onb-dots { display: flex; gap: 6px; }
.onb-dots i { height: 5px; flex: 1; border-radius: 3px; background: var(--sunk); }
.onb-dots i.on { background: var(--accent); }
.lead { font-size: 19px; }
.goal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.goal-card { position: relative; display: grid; gap: 4px; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 8px 10px; }
.goal-card .thumb { width: 100%; height: auto; aspect-ratio: 6 / 5; }
.goal-card.on { border-color: var(--accent); background: var(--accent-soft); }
.goal-card .tick { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; }
.opt-list { display: grid; gap: 8px; }
.opt { display: grid; gap: 2px; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt b { font-size: 18px; }
.lvl-pick { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.pick-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.pick { flex: none; display: grid; gap: 1px; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 10px; font-size: 14px; font-weight: 600; max-width: 170px; }
.pick small { font-size: 11px; font-weight: 400; color: var(--muted); }
.pick.below { background: var(--accent-soft); border-color: transparent; }
.pick.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pick.on small { color: var(--on-accent); }
.week-type { list-style: none; padding: 0; display: grid; gap: 4px; }
.week-type li { display: flex; justify-content: space-between; font-size: 15px; }

/* Barre d'onglets */
#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-btn { flex: 1 1 0; max-width: 140px; height: var(--nav-h); border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; }
.nav-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn.on { color: var(--accent); }

/* Séance guidée */
.player { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px); }
.p-top { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.p-prog { flex: 1; display: grid; gap: 4px; justify-items: center; font-size: 15px; font-weight: 600; min-width: 0; }
.p-prog .bar { width: 100%; height: 5px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.p-prog .bar i { display: block; height: 100%; background: var(--accent); }
.p-body { max-width: 640px; margin: 0 auto; display: grid; gap: 12px; justify-items: center; text-align: center; padding-top: 12px; }
.p-stage { width: min(100%, 380px); }
.p-fig { width: 100%; height: auto; aspect-ratio: 6 / 5; background: var(--sunk); border-radius: 16px; display: block; }
.p-info { display: grid; gap: 3px; justify-items: center; }
.p-info h2 { font-size: clamp(26px, 6vw, 34px); }
.p-target { font-size: 22px; font-weight: 600; }
.p-ring { --p: 0; width: 140px; height: 140px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(closest-side, var(--bg) 84%, transparent 85%), conic-gradient(var(--accent) calc(var(--p) * 360deg), var(--sunk) 0); }
.p-ring.rest { background: radial-gradient(closest-side, var(--bg) 84%, transparent 85%), conic-gradient(var(--p3) calc(var(--p) * 360deg), var(--sunk) 0); }
.p-clock { font-size: 50px; font-weight: 700; }
.p-sub { font-weight: 600; min-height: 1.4em; }
.p-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.p-note { max-width: 46ch; }
.stepper { display: flex; align-items: center; gap: 16px; }
.stepper .icon-btn { width: 52px; height: 52px; font-size: 26px; }
.st-val { display: grid; justify-items: center; }
.st-val b { font-size: 46px; line-height: 1; }
.summary { text-align: center; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
.stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 6px; display: grid; }
.stats b { font-size: 34px; line-height: 1; }
.stats span { font-size: 13px; color: var(--muted); }
.summary .card { width: 100%; }
.fb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
.fb-btn { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px; display: grid; gap: 2px; }
.fb-btn.on { border-color: var(--accent); background: var(--accent-soft); }
.summary .stack { width: 100%; }

/* Transitions d'écran */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#view > .screen { animation: rise .22s ease-out; }

/* Aujourd'hui : réglages et série */
.top.with-gear { position: relative; padding-right: 54px; }
.gear { position: absolute; top: 0; right: 0; }
.gear svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.streak { justify-self: start; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; color: var(--warn); background: var(--warn-soft); padding: 4px 10px 4px 6px; border-radius: 99px; }
.flame svg { width: 18px; height: 18px; fill: currentColor; display: block; }

/* Progrès */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 2px; }
.kpi b { font-size: 32px; line-height: 1; }
.kpi span { font-size: 13px; color: var(--muted); }
.cal { display: flex; gap: 6px; overflow-x: auto; }
.cal-days { display: grid; grid-template-rows: repeat(7, 16px); gap: 3px; font-size: 11px; color: var(--muted); }
.cal-grid { display: flex; gap: 3px; }
.cal-col { display: grid; grid-template-rows: repeat(7, 16px); gap: 3px; }
.cal i { width: 16px; height: 16px; border-radius: 4px; background: var(--sunk); display: block; }
.cal i.plan, .cal-legend i.plan { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); }
.cal i.on, .cal-legend i.on { background: var(--accent); box-shadow: none; }
.cal i.fut { opacity: .45; }
.cal i.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.cal-legend { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.cal-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.big-num { font-size: 34px; font-weight: 700; }
.big-num small { font-size: 15px; color: var(--muted); }
.chart-wrap { position: relative; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }

/* Raretés : plus c'est rare, plus c'est stylé */

    if (ok) { n++; continue; }

    if (extra < ((settings.shop && settings.shop.freezes) || 0)) { extra++; frozen++; n++; continue; } // gels achetés dans la boutique

  if (!old.length && !isOld(settings.pets.equip)) return;
  const used = {};
  const mapId = id => { const r = PET[id].r; const pool = NEW_PETS.filter(p => p.r === r); used[r] = used[r] || 0; const np = pool[used[r] % pool.length]; used[r]++; return np.id; };
  const conv = {};
  old.forEach(id => { const nid = mapId(id); conv[id] = nid; settings.pets.owned[nid] = (settings.pets.owned[nid] || 0) + settings.pets.owned[id]; delete settings.pets.owned[id]; });
  if (conv[settings.pets.equip]) settings.pets.equip = conv[settings.pets.equip];
  else if (isOld(settings.pets.equip)) settings.pets.equip = Object.keys(settings.pets.owned)[0] || null;
  settings.pets.log = settings.pets.log.map(l => Object.assign(l, { id: conv[l.id] || l.id }));
  saveAll();
})();
PETS.splice(0, PETS.length, ...NEW_PETS);
Object.keys(PET).forEach(k => delete PET[k]); PETS.forEach(p => { PET[p.id] = p; });

/* =====================================================================
   V9 : compagnons en style « icône » (contour épais, ombrage en aplats)
   Chaque créature a son propre dessin : plus de variantes recolorées.
   ===================================================================== */
const OL = "#1d1e2c";
let CEL_N = 0;
// Symétrie gauche/droite autour de x = 60 (chemins absolus M L C Q Z uniquement)
const mir = d => d.replace(/(-?\d*\.?\d+)[ ,]+(-?\d*\.?\d+)/g, (m, a, b) => +(120 - a).toFixed(2) + " " + b);

/* Forme ombrée : aplat de base, motifs internes, croissant d'ombre en bas, reflet, contour */
function cel(u, d, base, shade, o) {
  o = o || {};
  const id = u + "k" + (++CEL_N), dx = o.dx == null ? -2 : o.dx, dy = o.dy == null ? -5 : o.dy;
  const hl = o.hl ? '<ellipse cx="' + o.hl[0] + '" cy="' + o.hl[1] + '" rx="' + o.hl[2] + '" ry="' + o.hl[3] + '" fill="#fff" opacity="' + (o.hlo || .5) + '"' + (o.hl[4] ? ' transform="rotate(' + o.hl[4] + ' ' + o.hl[0] + ' ' + o.hl[1] + ')"' : '') + '/>' : "";
  return '<g' + (o.cls ? ' class="' + o.cls + '"' : "") + (o.f ? ' filter="url(#' + u + 'g)"' : "") + '>' +
    '<clipPath id="' + id + 'c"><path d="' + d + '"/></clipPath>' +
    '<mask id="' + id + 'm" maskUnits="userSpaceOnUse" x="-40" y="-40" width="200" height="200"><path d="' + d + '" fill="#fff"/><path d="' + d + '" fill="#000" transform="translate(' + dx + ' ' + dy + ')"/></mask>' +
    '<path d="' + d + '" fill="' + base + '"/>' +
    '<g clip-path="url(#' + id + 'c)">' + (o.x || "") + '<path d="' + d + '" fill="' + shade + '" opacity="' + (o.so || .9) + '" mask="url(#' + id + 'm)"/>' + hl + '</g>' +
    '<path d="' + d + '" fill="none" stroke="' + OL + '" stroke-width="' + (o.sw || 3) + '" stroke-linejoin="round"/></g>';
}
const cel2 = (u, d, b, s, o) => { o = o || {}; return cel(u, d, b, s, Object.assign({}, o, { cls: o.cls ? o.cls + " s-l" : o.cls })) + cel(u, mir(d), b, s, Object.assign({}, o, { cls: o.cls ? o.cls + " s-r" : o.cls, hl: o.hl ? [120 - o.hl[0], o.hl[1], o.hl[2], o.hl[3], -(o.hl[4] || 0)] : null, x: o.x ? mir(o.x) : "" })); };
const ln = (d, w, c) => '<path d="' + d + '" fill="none" stroke="' + (c || OL) + '" stroke-width="' + (w || 3) + '" stroke-linecap="round" stroke-linejoin="round"/>';
const glowLn = (u, d, c, w, cls) => '<path class="' + (cls || "s-glow") + '" d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + (w || 2.4) + '" stroke-linecap="round" stroke-linejoin="round" filter="url(#' + u + 'g)"/>';
const fill = (d, c, extra) => '<path d="' + d + '" fill="' + c + '"' + (extra || "") + '/>';
const fang = (x, y, s) => '<path d="M' + (x - 2.4 * s) + ' ' + y + ' L' + x + ' ' + (y + 5 * s) + ' L' + (x + 2.4 * s) + ' ' + y + ' Z" fill="#fff" stroke="' + OL + '" stroke-width="1.6" stroke-linejoin="round"/>';
const dot = (x, y, r, c, cls) => '<circle' + (cls ? ' class="' + cls + '"' : '') + ' cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + c + '"/>';

/* Œil au regard déterminé : paupière sombre en biais, iris coloré, reflets */
function eye(u, x, y, r, iris, o) {
  o = o || {};
  if (o.sl) return ln("M" + (x - r) + " " + y + " Q" + x + " " + (y + r * .6) + " " + (x + r) + " " + y, 3);
  const inn = o.inn || (x < 60 ? 1 : -1), id = u + "e" + (++CEL_N), rx = r * (o.w || .88), W = rx + 2;
  const lid = "M" + (x - inn * W) + " " + (y - r - 2) + " L" + (x + inn * W) + " " + (y - r - 2) + " L" + (x + inn * W) + " " + (y - r * (o.a1 == null ? .05 : o.a1)) + " L" + (x - inn * W) + " " + (y - r * (o.a2 == null ? .6 : o.a2)) + " Z";
  const ix = x + inn * r * .14, iy = y + r * .14, ir = r * (o.ir || .64);
  const pupil = o.slit ? '<ellipse cx="' + ix + '" cy="' + iy + '" rx="' + ir * .2 + '" ry="' + ir * .82 + '" fill="#0d0d14"/>' : dot(ix, iy, ir * .48, "#0d0d14");
  return '<g class="s-eye"><clipPath id="' + id + '"><ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="' + r + '"/></clipPath>' +
    '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="' + r + '" fill="' + (o.sc || "#fff") + '"/>' +
    '<g clip-path="url(#' + id + ')"><circle cx="' + ix + '" cy="' + iy + '" r="' + ir + '" fill="' + iris + '"' + (o.glow ? ' filter="url(#' + u + 'g)"' : '') + '/>' +
    '<circle cx="' + ix + '" cy="' + (iy + ir * .35) + '" r="' + ir * .7 + '" fill="#fff" opacity=".22"/>' + pupil +
    dot(ix - inn * ir * .38, iy - ir * .05, ir * .26, "#fff") + dot(ix + inn * ir * .3, iy + ir * .4, ir * .12, "#fff") +
    '<path d="' + lid + '" fill="' + OL + '"/></g>' +
    '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="' + r + '" fill="none" stroke="' + OL + '" stroke-width="2.6"/></g>';
}
const eyes = (u, cx, y, gap, r, iris, o) => eye(u, cx - gap, y, r, iris, o) + eye(u, cx + gap, y, r, iris, o);
// Yeux lumineux sans pupille (esprits, golems, machines)
const glowEyes = (u, sl, d, c, w) => {
  if (sl) { const n = d.match(/-?\d*\.?\d+/g).map(Number), L = "M" + n[0] + " " + n[1] + " L" + n[2] + " " + n[1]; return ln(L, 3) + ln(mir(L), 3); }
  return glowLn(u, d, c, w || 4, "s-eye") + glowLn(u, mir(d), c, w || 4, "s-eye");
};

    out.push(Object.assign(item(ex, test ? dose.replace(/^(\d+) ×/, (m, n) => Math.min(2, +n) + " ×") : dose, unit, note), { eyebrow: tag, keep: true, spec: true }));
  });
  return out;
}

// La séance normale passe en entretien, le bloc passe en premier
let SPEC_CTX = null;
const _cuBase10 = cuBaseSession;
cuBaseSession = function (w, type) {
  const b = _cuBase10(w, type), sp = SPEC_CTX;
  if (!sp) return b;
  b.warm = b.warm.filter(x => x.tree !== sp.id);
  const rest = b.main.filter(x => x.tree !== sp.id && !(x.tree && (x.eyebrow || "").includes("palier suivant")));
  rest.forEach(x => { if (x.tree && TREE[x.tree].skill && !x.validate) { x.dose = x.dose.replace(/^(\d+) ×/, (m, n) => Math.max(2, Math.ceil(n / 2)) + " ×"); if (!/^Entretien/.test(x.eyebrow || "")) x.eyebrow = "Entretien · " + (x.eyebrow || TREE[x.tree].name); } });
  b.main = specItems(sp).concat(rest);

};
// Pendant un bloc, pas de négatifs ni d'EMOM supplémentaires pour les skills en entretien
const _extraItems10 = extraItems;
extraItems = function (main, s) {

  const keepF = settings.focus; settings.focus = [];
  try { return _extraItems10(main, s); } finally { settings.focus = keepF; }
};
const _session10 = session;
session = function (abs, d) {
  const sp = specAt(abs, d);
  if (!sp) return _session10(abs, d);
  const keepF = settings.focus;
  settings.focus = keepF.filter(x => x !== sp.id); SPEC_CTX = sp;
  try {
    const s = _session10(abs, d);
    if (s) Object.assign(s, { spec: sp, meta: Object.assign({}, s.meta, { sub: s.main.some(i => i.spec) ? "Bloc intensif " + SPEC[sp.id].name + (sp.wm === 3 ? " (test)" : sp.heavy ? " (lourd)" : " (technique)") + ", puis entretien" : "Bloc " + SPEC[sp.id].name + " en pause ici (pas de barre) : séance d'entretien" }) });
    return s;
  } finally { settings.focus = keepF; SPEC_CTX = null; }
};

/* ---------- Lancer, arrêter, archiver ---------- */
function startSpec(id) {
  if (settings.spec) archiveSpec(true);
  settings.spec = { id, start: iso(mondayOf(new Date())), lv0: Math.min(levels[id], TREE[id].steps.length) };
  saveAll(); toast("Bloc intensif lancé : " + SPEC[id].name + " pour 12 semaines"); render(); window.scrollTo(0, 0);
}
function archiveSpec(stopped) {
  const sp = settings.spec; if (!sp) return;
  settings.specHist.unshift({ id: sp.id, start: sp.start, lv0: sp.lv0, lv1: levels[sp.id], end: iso(new Date()), stopped: !!stopped && specWeekNow() <= 12, goals: specGoals(sp).filter(g => g.done).length });
  settings.specHist = settings.specHist.slice(0, 20);
  settings.spec = null; saveAll();
}

/* ---------- Affichage ---------- */
function specBar(sw) { return h("div", { class: "segs spec-bar", style: "--n:12" }, Array.from({ length: 12 }, (_, i) => h("i", { class: (i + 1 < sw ? "on" : i + 1 === sw ? "cur" : "") + ((i + 1) % 4 === 0 ? " test" : "") }))); }
function goalList(sp, sw) {
  return h("ol", { class: "spec-goals" }, specGoals(sp).map(g => h("li", { class: (g.done ? "ok" : "") + (sw && Math.ceil(sw / 4) === g.k + 1 && !g.done ? " now" : "") },
    h("span", { class: "sg-mark", "aria-hidden": "true" }, g.done ? "✓" : String(g.k + 1)),
    h("div", null, h("span", { class: "eyebrow" }, "Mois " + (g.k + 1)), h("b", null, g.label), g.std ? h("span", { class: "muted small" }, "Standard : " + g.std) : null))));
}
function specCard() {
  const sp = settings.spec; if (!sp) return null;
  const sw = specWeekNow(), t = TREE[sp.id], goals = specGoals(sp);
  if (sw > 12) return h("section", { class: "card spec-card stack" },
    h("span", { class: "eyebrow" }, "Bloc intensif terminé · " + SPEC[sp.id].name),
    h("h3", null, goals.filter(g => g.done).length + " objectif" + (goals.filter(g => g.done).length > 1 ? "s" : "") + " sur 3 atteint" + (goals.filter(g => g.done).length > 1 ? "s" : "")),
    goalList(sp),
    h("p", { class: "muted small" }, "Ton programme normal a repris. Enchaîne avec un autre bloc, ou garde quelques semaines d'entraînement équilibré avant le suivant."),
    h("div", { class: "hero-actions" }, h("button", { class: "btn", onclick: () => { archiveSpec(false); openSub({ type: "spec" }); } }, "Choisir un nouveau bloc"), h("button", { class: "btn ghost", onclick: () => { archiveSpec(false); render(); } }, "Archiver")));
  const m = Math.max(1, Math.ceil(sw / 4)), g = goals[m - 1], test = sw >= 1 && (sw - 1) % 4 === 3;
  return h("button", { class: "card spec-card", onclick: () => openSub({ type: "spec" }) },
    h("div", { class: "row-between" }, h("span", { class: "eyebrow" }, "Bloc intensif · " + t.name + " · semaine " + Math.max(1, sw) + "/12"), test ? h("span", { class: "tag warn" }, "Test du mois") : null),
    h("b", { class: "spec-goal" }, (g.done ? "✓ " : "") + g.label),
    specBar(sw),
    h("span", { class: "muted small" }, test ? "Semaine de test : tente le standard lors de ta séance lourde, puis récupère." : "Mois " + m + " sur 3 · " + goals.filter(x => x.done).length + "/3 objectifs atteints · Voir le bloc ›"));
}
function renderSpec() {
  const sp = settings.spec, sw = specWeekNow();
  const cards = SPEC_IDS.map(id => {
    const t = TREE[id], lv = levels[id], N = t.steps.length, st = t.steps[Math.min(lv, N - 1)], on = sp && sp.id === id;
    const g = specGoals({ id, lv0: Math.min(lv, N) });
    return h("section", { class: "card spec-pick" + (on ? " on" : "") },
      h("div", { class: "sp-head" }, thumb(st.ex, "sm"),
        h("div", null, h("span", { class: "eyebrow" }, t.name + " · palier " + Math.min(lv + 1, N) + "/" + N), h("b", null, SPEC[id].name), h("span", { class: "muted small" }, lv >= N ? "Arbre terminé" : "Actuel : " + st.t))),
      h("p", { class: "small" }, h("b", null, "En 3 mois : "), g.map(x => x.label.replace(/^Valider : /, "")).join(" → ")),
      h("p", { class: "muted small" }, SPEC[id].real),
      on ? h("span", { class: "tag accent" }, "Bloc en cours") : sp ? confirmBtn("Remplacer le bloc actuel", "Confirmer : arrêter " + SPEC[sp.id].name + " ?", () => startSpec(id), "btn ghost small") : h("button", { class: "btn small", onclick: () => startSpec(id) }, "Lancer ce bloc"));
  });
  const hist = settings.specHist;
  return h("div", { class: "screen" },
    backBar("Retour", closeSub),
    h("header", { class: "top" }, h("span", { class: "eyebrow" }, "12 semaines · 1 skill en priorité"), h("h1", null, "Blocs intensifs"),
      h("p", { class: "muted" }, "Un skill passe en priorité absolue pendant 3 mois. Tes autres skills restent en entretien, avec moins de séries.")),
    sp && sw <= 12 ? h("section", { class: "card stack" },
      h("span", { class: "eyebrow" }, "En cours · semaine " + Math.max(1, sw) + "/12 · depuis le " + fmtShort(new Date(sp.start + "T12:00:00"))),
      h("h2", null, SPEC[sp.id].name), specBar(sw), goalList(sp, sw),
      h("h3", null, "Conseils"), h("ul", { class: "how" }, SPEC[sp.id].tips.map(x => h("li", null, x))),
      confirmBtn("Arrêter le bloc", "Confirmer l'arrêt ?", () => { archiveSpec(true); toast("Bloc arrêté : retour au programme normal"); render(); }, "btn ghost small")) : null,
    h("section", { class: "card stack" }, h("h3", null, "Comment ça marche"),
      h("ol", { class: "how" },
        h("li", null, h("b", null, "Chaque mois : 3 semaines de charge, 1 semaine de test. "), "Les tenues montent de 70 à 85 % de ta tenue max. En semaine 4, tu tentes le standard du palier lors de ta séance lourde, puis tu récupères."),
        h("li", null, h("b", null, "Séances lourdes et techniques. "), "Le skill est travaillé à chaque séance, mais jamais lourd deux jours de suite : les tendons récupèrent moins vite que les muscles."),
        h("li", null, h("b", null, "Objectifs par mois. "), "Valider ton palier actuel, puis le suivant, puis toucher celui d'après. Valide-les comme d'habitude, le bloc s'adapte."),
        h("li", null, h("b", null, "Ensuite. "), "Après 12 semaines, ton programme normal reprend. Tu peux enchaîner sur un autre bloc."))),
    h("section", { class: "stack" }, h("h3", null, sp && sw <= 12 ? "Changer de bloc" : "Choisir un bloc"), h("div", { class: "spec-grid" }, cards)),
    hist.length ? h("section", { class: "stack" }, h("h3", null, "Blocs précédents"),
      h("ul", { class: "journal" }, hist.map(x => h("li", null, h("span", { class: "num muted" }, fmtShort(new Date(x.start + "T12:00:00"))), " " + SPEC[x.id].name + " · " + x.goals + "/3 objectifs" + (x.stopped ? " · arrêté" : ""))))) : null);
}

/* ---------- Points d'entrée : Aujourd'hui, Skills, fiche d'un arbre ---------- */
const _renderToday10 = renderToday;
renderToday = function () {
  const scr = _renderToday10(), c = specCard();
  if (c) { const pc = scr.querySelector(".player-card"); (pc || scr.querySelector(".top")).after(c); }
  return scr;
};
const _renderSkills10 = renderSkills;
renderSkills = function () {

    h("span", { class: "eyebrow" }, "Nouveau · 3 mois"), h("b", null, sp ? "Bloc intensif en cours : " + SPEC[sp.id].name : "Blocs intensifs"),
    h("span", { class: "muted small" }, sp ? "Semaine " + Math.min(12, Math.max(1, specWeekNow())) + "/12 · voir les objectifs ›" : "Planche, handstand, muscle-up, front lever… Un skill en priorité pendant 12 semaines ›")));
  return scr;
};

      h("p", { class: "muted small" }, SPEC[id].real),

    $("#nav").hidden = false; renderNav(); $("#view").replaceChildren(renderSpec()); return;
  }

};
render();
