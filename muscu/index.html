<style>
/* Même famille visuelle que Cap Calisthénie : mode clair imposé, une colonne d'appli (max 720 px), barre d'onglets fixe en bas.
   Accent « acier » pour distinguer l'app de muscu ; couleurs de phase pour le bloc de 12 semaines. */
:root {
  --bg: #eef1f3; --surface: #ffffff; --sunk: #e2e7eb; --ink: #141c22; --muted: #5a6670; --line: #d1d9df;
  --accent: #1d5a9c; --accent-soft: #dbe6f3; --on-accent: #ffffff; --warn: #b4532a; --warn-soft: #f6e3d9;
  --ok: #0b7a63; --ok-soft: #d5ece5;
  --ph-intro: #7f8c95; --ph-accu: #0b8f75; --ph-deload: #9aa6ad; --ph-inten: #cf4a3c; --ph-taper: #c98a1c; --ph-test: #7a4fc4;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px; --nav-h: 64px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(34px, 8vw, 46px); font-weight: 700; }
h2 { font-size: 28px; font-weight: 700; }
h3 { font-size: 21px; font-weight: 600; }
p { margin: 0; }
ul, ol { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow, .label { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

#view { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px)); }
.screen { display: grid; gap: 18px; }
.top { display: grid; gap: 6px; }
.stack { display: grid; gap: 10px; align-content: start; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }

/* Boutons */
.btn { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 12px; padding: 11px 18px; font-weight: 600; font-size: 16px; }
.btn.big { padding: 15px 24px; font-size: 18px; }
.btn.small { padding: 7px 12px; font-size: 14px; border-radius: 9px; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.armed { background: var(--warn); color: #fff; }
.btn.danger { background: var(--surface); color: var(--warn); border: 1px solid var(--line); }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; }
.back { justify-self: start; border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 16px; padding: 4px 0; }
.icon-btn.armed { width: auto; padding: 0 12px; font-size: 14px; font-weight: 600; background: var(--warn); color: #fff; border-color: var(--warn); }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; display: grid; place-items: center; }
.cta { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 10px; justify-content: center; background: linear-gradient(transparent, var(--bg) 30%); z-index: 5; }
.cta .btn.big { flex: 0 1 440px; }

/* Étiquettes */
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.note-box { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.note-box.warn { background: var(--warn-soft); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 13px; font-size: 14px; font-weight: 500; }
.chip-btn.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; background: var(--sunk); border-radius: 10px; justify-self: start; }
.seg button { white-space: nowrap; border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--muted); }

      P.rec[P.i].length ? h("div", { class: "done-sets" }, P.rec[P.i].map((x, k) => h("span", { class: "tag " + (x.r >= P.plan[P.i][k].r ? "ok" : "warn") }, "S" + (k + 1) + " " + (e.amrap ? "" : kg(x.w) + "×") + x.r + (e.amrap ? "" : " @" + rpeTxt(x.rpe))))) : null,
      h("div", { class: "p-btns" },
        h("button", { class: "btn big", onclick: validateSet }, "Valider la série"),
        h("button", { class: "btn ghost", onclick: () => nextEx(false) }, P.i + 1 >= N ? "Terminer" : "Passer l'exercice")));
  }
  box.replaceChildren(top, body);
}
function finishSession() { if (!P.saved) recordSession(); P.phase = "done"; drawP(); }
function recordSession() {
  const L = { id: "L" + Date.now(), ts: Date.now(), dur: Math.round((Date.now() - P.started) / 60000), key: P.sess.key, name: P.sess.name, dayIdx: P.sess.dayIdx, week: P.sess.week, cycle: STATE.block.cycle,
    items: P.sess.items.map((it, i) => ({ ex: it.ex, role: it.role, rng: it.rng || null, tgt: P.plan[i].map(x => ({ w: x.w, r: x.r, rpe: x.rpe })), sets: P.rec[i] })) };
  applyLog(L);
  const done = L.items.filter(i => i.sets.length);
  L.n = done.length; L.hits = done.filter(i => i.hit).length;
  L.vol = Math.round(done.reduce((a, i) => a + i.sets.reduce((b, x) => b + toTot(i.ex, x.w) * x.r, 0), 0));
  STATE.logs.push(L); save(); pushLog(L);
  P.saved = L; beep(784, 0.12); setTimeout(() => beep(1046, 0.18), 160); buzz([60, 60, 120]);
}
function summaryBody() {
  if (!P.saved) recordSession();
  const L = P.saved, done = L.items.filter(i => i.sets.length);
  const prs = done.filter(i => i.pr);
  return h("div", { class: "p-body" },
    h("div", { class: "p-info" }, h("span", { class: "eyebrow" }, L.name + " · semaine " + L.week), h("h2", null, L.hits === L.n ? "Tous les objectifs atteints" : L.hits + " objectif" + (L.hits > 1 ? "s" : "") + " sur " + L.n)),
    h("div", { class: "stats" }, h("div", null, h("b", null, L.hits + "/" + L.n), h("span", null, "objectifs")), h("div", null, h("b", null, L.dur), h("span", null, "minutes")), h("div", null, h("b", null, kg(Math.round(L.vol / 100) / 10)), h("span", null, "tonnes soulevées"))),
    prs.length ? h("div", { class: "note-box" }, h("b", null, "Nouveaux records : "), prs.map(i => EX[i.ex].amrap ? i.sets[0].r + " pompes" : EX[i.ex].n + " (" + (EX[i.ex].bw ? "+" : "") + kg(Math.round(toDisp(i.ex, i.after) * 2) / 2) + " kg estimé)").join(", ")) : null,
    h("ul", { class: "res" }, done.map(i => {
      const e = EX[i.ex], d = i.after != null && i.before != null && !e.amrap && !e.pdc ? i.after - i.before : null;
      return h("li", null, h("span", { class: "mk" + (i.hit ? "" : " no") }, i.hit ? "✓" : "✕"), h("b", null, e.n),
        h("small", null, i.sets.map(x => (e.amrap ? "" : kg(x.w) + "×") + x.r).join(" · ") + (d != null && Math.abs(d) >= 0.1 ? " · 1RM " + (d > 0 ? "+" : "") + kg(Math.round(d * 10) / 10) + " kg" : "") + (i.cut ? " · deux ratés : −10 % la prochaine fois" : "")));
    })),
    L.weekDone ? h("div", { class: "note-box" }, L.blockDone ? "Bloc terminé ! Un nouveau cycle démarre avec tes nouveaux maxes." : "Semaine terminée. Place à la semaine " + STATE.block.week + " (" + PHASES[weekDef(STATE.block.week).ph].n + ").") : null,
    h("p", { class: "small muted" }, "Les objectifs de la prochaine séance sont déjà recalculés."),
    h("div", { class: "p-btns" }, h("button", { class: "btn big", onclick: () => { P.saved = null; S.sel = null; closeP(); } }, "Fermer")));
}

/* ---------- Rendu ---------- */
function render() {
  renderNav();
  let scr;
  const sub = S.sub;
  if (sub && sub.type === "session") scr = renderSessionDetail(sub.day, sub.week);
  else if (sub && sub.type === "swap") scr = renderSwap(sub.key, sub.cur);
  else if (sub && sub.type === "exo") scr = renderExo(sub.id);
  else scr = { today: renderToday, plan: renderPlan, prog: renderProgress, ex: renderExercises, profile: renderProfile }[S.tab]();
  $("#view").replaceChildren(scr);
}
render();
initSync();
</script>
